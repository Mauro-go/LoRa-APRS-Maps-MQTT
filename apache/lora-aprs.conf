# LoRa APRS Maps MQTT
#
# API and Apache on the same server:
ProxyPass        /lora-api/ http://127.0.0.1:8080/api/
ProxyPassReverse /lora-api/ http://127.0.0.1:8080/api/

# If the API runs on another server, replace 127.0.0.1 with the
# LAN address of that server, for example:
#
# ProxyPass        /lora-api/ http://192.168.1.50:8080/api/
# ProxyPassReverse /lora-api/ http://192.168.1.50:8080/api/
