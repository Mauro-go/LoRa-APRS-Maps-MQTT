<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API = "/lora-api";
const REFRESH_INTERVAL = 10000;


const UPDATE_OVERLAY_DELAY = 2500;
let updateOverlayTimer = null;

function beginDelayedUpdateOverlay() {
    clearTimeout(updateOverlayTimer);

    updateOverlayTimer = setTimeout(() => {
        const overlay = document.getElementById("updateOverlay");
        if (overlay) {
            overlay.classList.add("visible");
            overlay.setAttribute("aria-hidden", "false");
        }
    }, UPDATE_OVERLAY_DELAY);
}

function endDelayedUpdateOverlay() {
    clearTimeout(updateOverlayTimer);
    updateOverlayTimer = null;

    const overlay = document.getElementById("updateOverlay");
    if (overlay) {
        overlay.classList.remove("visible");
        overlay.setAttribute("aria-hidden", "true");
    }
}

const SYMBOL_PATH = "/aprs-symbols/";

let currentLanguage =
    localStorage.getItem("lora-aprs-language") === "en"
        ? "en"
        : "it";

function t(it, en) {
    return currentLanguage === "en" ? en : it;
}

function applyLanguage(language) {
    currentLanguage = language === "en" ? "en" : "it";
    document.documentElement.dataset.lang = currentLanguage;
    document.documentElement.lang = currentLanguage;
    localStorage.setItem("lora-aprs-language", currentLanguage);

    const languageSelect = document.getElementById("languageSelect");
    if (languageSelect) languageSelect.value = currentLanguage;

    const periodSelect = document.getElementById("periodSelect");
    if (periodSelect) {
        const labels = currentLanguage === "en"
            ? ["Last hour", "Last 4 hours", "Last 8 hours", "Last 12 hours", "Last 24 hours", "Last week"]
            : ["Ultima ora", "Ultime 4 ore", "Ultime 8 ore", "Ultime 12 ore", "Ultime 24 ore", "Ultima settimana"];
        Array.from(periodSelect.options).forEach((option, index) => {
            if (labels[index]) option.textContent = labels[index];
        });
        periodSelect.title = t("Periodo delle stazioni ascoltate", "Period of heard stations");
    }
}

applyLanguage(currentLanguage);

let map;
let markers = {};
let hoverConnectionLines = [];
let firstLoad = true;
let trackLayers = {};
let selectedPeriodHours = 1;


const params =
    new URLSearchParams(window.location.search);

const REQUESTED_RECEIVER =
    params.get("receiver");

let RECEIVER = null;
let RECEIVER_LAT = null;
let RECEIVER_LON = null;

let coverageLines = {};




/* ============================================================
   MAPPA
   ============================================================ */

map = L.map("map", {
    zoomControl: true
});

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

map.setView([46.07, 13.24], 7);


/* ============================================================
   DATE
   ============================================================ */

function formatDate(value) {

    if (!value) {
        return "-";
    }

    try {

        const d = new Date(value);

        if (isNaN(d.getTime())) {
            return value;
        }

        return d.toLocaleString(
            currentLanguage === "en" ? "en-GB" : "it-IT",
            {
                dateStyle: "short",
                timeStyle: "medium"
            }
        );

    }
    catch (e) {
        return value;
    }
}


/* ============================================================
   APRS SYMBOL TABLE
   ============================================================ */

const APRS_TRANSLATION = [

    '!"#$%&\'()*+,-./0',
    '123456789:;<=>?@',
    'ABCDEFGHIJKLMNOP',
    'QRSTUVWXYZ[\\]^_`',
    'abcdefghijklmnop',
    'qrstuvwxyz{|}~'

];


function getSymbolPosition(code) {

    if (!code) {
        return null;
    }

    for (
        let row = 0;
        row < APRS_TRANSLATION.length;
        row++
    ) {

        const chars = APRS_TRANSLATION[row];

        const col = chars.indexOf(code);

        if (col !== -1) {

            return {
                row: row,
                col: col
            };
        }
    }

    return null;
}


/* ============================================================
   DECODIFICA SIMBOLO
   ============================================================ */

function decodeSymbol(symbolTable, symbolCode) {

    let table = 0;
    let overlay = null;
    let code = symbolCode;

    if (!symbolCode) {

        return {
            table: 0,
            overlay: null,
            code: ">"
        };
    }

    if (symbolTable === "/") {

        table = 0;
        overlay = null;
    }

    else if (symbolTable === "\\") {

        table = 1;
        overlay = null;
    }

    else if (/^[0-9]$/.test(symbolTable)) {

        table = 1;
        overlay = symbolTable;
    }

    else if (/^[a-j]$/.test(symbolTable)) {

        table = 1;

        overlay =
            String(
                symbolTable.charCodeAt(0) -
                "a".charCodeAt(0)
            );
    }

    else if (/^[A-Z]$/.test(symbolTable)) {

        table = 1;
        overlay = symbolTable;
    }

    else {

        table = 0;
        overlay = null;
    }

    return {
        table: table,
        overlay: overlay,
        code: code
    };
}


/* ============================================================
   CREA SIMBOLO
   ============================================================ */

function createAPRSSymbolElement(
    symbolTable,
    symbolCode
) {

    const decoded =
        decodeSymbol(
            symbolTable,
            symbolCode
        );

    const position =
        getSymbolPosition(
            decoded.code
        );

    const finalPosition =
        position ||
        getSymbolPosition(">");

    const element =
        document.createElement("span");

    element.className =
        "aprs-symbol";

    element.style.backgroundImage =
        "url('" +
        SYMBOL_PATH +
        "aprs-symbols-24-" +
        decoded.table +
        ".png')";

    element.style.backgroundPosition =
        "-" +
        (finalPosition.col * 24) +
        "px -" +
        (finalPosition.row * 24) +
        "px";

    let overlayElement = null;

    if (decoded.overlay) {

        overlayElement =
            document.createElement("span");

        overlayElement.className =
            "aprs-overlay";

        if (
            decoded.overlay === "L" &&
            decoded.code === "_"
        ) {

            overlayElement.classList.add("wx");

        }
        else {

            overlayElement.classList.add("lora");
        }

        overlayElement.textContent =
            decoded.overlay;
    }

    return {
        symbol: element,
        overlay: overlayElement
    };
}


/* ============================================================
   ICONA APRS
   ============================================================ */

function createAPRSIcon(
    callsign,
    packet,
    station
) {

    let symbolTable = "/";
    let symbolCode = ">";

    if (
        station &&
        station.symbol_table !== undefined &&
        station.symbol_table !== null &&
        station.symbol_table !== ""
    ) {

        symbolTable =
            String(
                station.symbol_table
            );
    }

    if (
        station &&
        station.symbol_code !== undefined &&
        station.symbol_code !== null &&
        station.symbol_code !== ""
    ) {

        symbolCode =
            String(
                station.symbol_code
            );
    }

    const symbol =
        createAPRSSymbolElement(
            symbolTable,
            symbolCode
        );

    const marker =
        document.createElement("div");

    marker.className =
        "aprs-marker";

    marker.appendChild(
        symbol.symbol
    );

    if (symbol.overlay) {

        marker.appendChild(
            symbol.overlay
        );
    }

    const label =
        document.createElement("span");

    label.className =
        "callsign";

    label.textContent =
        callsign;

    marker.appendChild(
        label
    );

    return L.divIcon({

        className: "",

        html:
            marker.outerHTML,

        iconSize:
            [24, 24],

        iconAnchor:
            [12, 12]

    });
}


/* ============================================================
   PERCORSO APRS
   ============================================================ */

function getPacketRoute(packet) {

    const explicitPath =
        packet.path ||
        packet.route ||
        packet.digipeater_path ||
        packet.digipeaters ||
        packet.via ||
        null;

    if (Array.isArray(explicitPath)) {

        return explicitPath
            .map(value => String(value).trim())
            .filter(Boolean);
    }

    if (
        explicitPath !== null &&
        explicitPath !== undefined &&
        String(explicitPath).trim() !== ""
    ) {

        return String(explicitPath)
            .split(",")
            .map(value => value.trim())
            .filter(Boolean);
    }

    const raw =
        packet.packet ||
        packet.raw ||
        packet.data ||
        "";

    if (!raw) {
        return [];
    }

    const text =
        String(raw).trim();

    const headerMatch =
        text.match(/^[^>\s]+>([^:]+)/);

    if (!headerMatch) {
        return [];
    }

    const fields =
        headerMatch[1]
            .split(",")
            .map(value => value.trim())
            .filter(Boolean);

    if (fields.length <= 1) {
        return [];
    }

    return fields
        .slice(1)
        .filter(
            value =>
                value &&
                !/^TCPIP/i.test(value) &&
                !/^q[A-Z]/.test(value)
        );
}


/* ============================================================
   RICEZIONE / VIA
   ============================================================ */

function getReceivedDescription(packet) {

    const receiver =
        packet.receiver_callsign ||
        packet.receiver ||
        "-";

    const route =
        getPacketRoute(packet);

    let via = null;

    if (route.length > 0) {

        via =
            String(
                route[route.length - 1]
            )
                .trim()
                .replace(/\*$/, "");
    }

    return {
        receiver: String(receiver)
            .trim()
            .replace(/\*$/, ""),

        via: via,

        route: route
    };
}


/* ============================================================
   CARICAMENTO PACCHETTI
   ============================================================ */

async function loadPackets() {

    const status =
        document.getElementById("status");

    beginDelayedUpdateOverlay();

    try {

        status.textContent =
            t("Aggiornamento...", "Updating...");

        status.classList.remove("error");

        const response =
            await fetch(
                API + "/packets?limit=500",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        let packets;

        if (Array.isArray(data)) {
            packets = data;
        }

        else if (Array.isArray(data.packets)) {
            packets = data.packets;
        }

        else if (Array.isArray(data.data)) {
            packets = data.data;
        }

        else {
            packets = [];
        }

        updateMap(packets);

        status.textContent =
            t("Online", "Online") + " · " +
            new Date().toLocaleTimeString(currentLanguage === "en" ? "en-GB" : "it-IT");

    }

    catch (error) {

        console.error(error);

        status.textContent =
            t("Errore API", "API error");

        status.classList.add("error");
    }

    finally {
        endDelayedUpdateOverlay();
    }
}


/* ============================================================
   FILTRO TEMPORALE
   ============================================================ */

function getPacketTime(packet) {

    const value =
        packet.received_at ||
        packet.timestamp ||
        packet.time ||
        null;

    if (!value) {
        return null;
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return null;
    }

    return date;
}


function filterPacketsByPeriod(packets) {

    const now =
        Date.now();

    const periodMs =
        selectedPeriodHours *
        60 *
        60 *
        1000;

    const minimumTime =
        now - periodMs;

    return packets.filter(packet => {

        const date =
            getPacketTime(packet);

        if (!date) {
            return false;
        }

        return (
            date.getTime() >=
            minimumTime
        );
    });
}


/* ============================================================
   POSIZIONE PACCHETTO
   ============================================================ */

function getPacketPosition(packet) {

    let lat = null;
    let lon = null;

    if (
        packet.latitude !== undefined &&
        packet.longitude !== undefined &&
        packet.latitude !== null &&
        packet.longitude !== null
    ) {

        lat =
            parseFloat(packet.latitude);

        lon =
            parseFloat(packet.longitude);

    }

    else if (
        packet.lat !== undefined &&
        packet.lon !== undefined &&
        packet.lat !== null &&
        packet.lon !== null
    ) {

        lat =
            parseFloat(packet.lat);

        lon =
            parseFloat(packet.lon);
    }

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        return null;
    }

    if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
    ) {

        return null;
    }

    return {
        lat: lat,
        lon: lon
    };
}


/* ============================================================
   CLEAR TRACCE
   ============================================================ */

function clearTrackLayers() {

    Object.keys(trackLayers)
        .forEach(callsign => {

            const layer =
                trackLayers[callsign];

            if (!layer) {
                return;
            }

            if (layer.line) {
                map.removeLayer(layer.line);
            }

            if (
                layer.points &&
                Array.isArray(layer.points)
            ) {

                layer.points.forEach(point => {
                    map.removeLayer(point);
                });
            }
        });

    trackLayers = {};
}


/* ============================================================
   TRACCE STORICHE
   ============================================================ */

function updateTracks(stations) {

    clearTrackLayers();

    Object.values(stations)
        .forEach(station => {

            const callsign =
                station.callsign;

            const positionedPackets =
                station.packets
                    .map(packet => {

                        const position =
                            getPacketPosition(packet);

                        if (!position) {
                            return null;
                        }

                        return {
                            packet: packet,
                            position: position,
                            time: getPacketTime(packet)
                        };
                    })
                    .filter(item => item !== null);

            positionedPackets.sort((a, b) => {

                const ta =
                    a.time
                        ? a.time.getTime()
                        : 0;

                const tb =
                    b.time
                        ? b.time.getTime()
                        : 0;

                return ta - tb;
            });

            if (
                positionedPackets.length === 0
            ) {
                return;
            }

            const latLngs =
                positionedPackets.map(item => [
                    item.position.lat,
                    item.position.lon
                ]);

            const line =
                L.polyline(
                    latLngs,
                    {
                        color: "green",
                        weight: 3,
                        opacity: 0.75,
                        interactive: false
                    }
                );

            line.addTo(map);

            const points = [];

            positionedPackets.forEach(item => {

                const point =
                    L.circleMarker(
                        [
                            item.position.lat,
                            item.position.lon
                        ],
                        {
                            radius: 4,
                            color: "green",
                            weight: 1,
                            fillColor: "white",
                            fillOpacity: 0.9,
                            className: "track-point"
                        }
                    );

                point.on("click", () => {
                    window.location.href = "station.html?callsign=" + encodeURIComponent(callsign);
                });

                point.addTo(map);

                points.push(point);
            });

            trackLayers[callsign] = {
                line: line,
                points: points
            };

        });
}


/* ============================================================
   HOVER CONNECTION
   ============================================================ */

function clearHoverConnection() {

    if (
        !hoverConnectionLines ||
        !Array.isArray(hoverConnectionLines)
    ) {
        hoverConnectionLines = [];
        return;
    }

    hoverConnectionLines.forEach(line => {

        if (!line) {
            return;
        }

        try {
            map.removeLayer(line);
        }
        catch (e) {
            console.warn(
                "Errore rimozione linea hover:",
                e
            );
        }
    });

    hoverConnectionLines = [];
}


/* ============================================================
   NORMALIZZA CALLSIGN
   ============================================================ */

function normalizeCallsign(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase()
        .replace(/\*$/, "");
}


/* ============================================================
   INDICE POSIZIONI
   ============================================================ */

function buildPositionIndex(packets, stations) {

    const index = {};

    Object.values(stations)
        .forEach(station => {

            if (
                Number.isFinite(
                    Number(station.lat)
                ) &&
                Number.isFinite(
                    Number(station.lon)
                )
            ) {

                index[
                    normalizeCallsign(
                        station.callsign
                    )
                ] = {
                    lat: Number(station.lat),
                    lon: Number(station.lon)
                };
            }
        });

    const sortedPackets =
        [...packets].sort((a, b) => {

            const ta =
                getPacketTime(a);

            const tb =
                getPacketTime(b);

            const va =
                ta ? ta.getTime() : 0;

            const vb =
                tb ? tb.getTime() : 0;

            return vb - va;
        });

    sortedPackets.forEach(packet => {

        const callsign =
            packet.callsign ||
            packet.source ||
            packet.src ||
            packet.station;

        const position =
            getPacketPosition(packet);

        if (
            callsign &&
            position
        ) {

            const key =
                normalizeCallsign(
                    callsign
                );

            if (!index[key]) {

                index[key] = {
                    lat: position.lat,
                    lon: position.lon
                };
            }
        }

    });

    packets.forEach(packet => {

        const receiver =
            packet.receiver_callsign ||
            packet.receiver;

        if (!receiver) {
            return;
        }

        let lat = null;
        let lon = null;

        if (
            packet.receiver_latitude !== undefined &&
            packet.receiver_longitude !== undefined
        ) {

            lat =
                parseFloat(
                    packet.receiver_latitude
                );

            lon =
                parseFloat(
                    packet.receiver_longitude
                );
        }

        else if (
            packet.receiver_lat !== undefined &&
            packet.receiver_lon !== undefined
        ) {

            lat =
                parseFloat(
                    packet.receiver_lat
                );

            lon =
                parseFloat(
                    packet.receiver_lon
                );
        }

        if (
            Number.isFinite(lat) &&
            Number.isFinite(lon) &&
            lat >= -90 &&
            lat <= 90 &&
            lon >= -180 &&
            lon <= 180
        ) {

            index[
                normalizeCallsign(receiver)
            ] = {
                lat: lat,
                lon: lon
            };
        }
    });

    return index;
}


/* ============================================================
   DISEGNA TRATTA HOVER
   ============================================================ */

function drawHoverConnections(station, positionIndex) {

    clearHoverConnection();

    if (!station || !station.packets || station.packets.length === 0) {
        return;
    }

    const latest = station.packets[0];
    const reception = getReceivedDescription(latest);

    const nodes = [];

    const srcKey = normalizeCallsign(station.callsign);
    if (positionIndex[srcKey]) {
        nodes.push(positionIndex[srcKey]);
    } else if (station.lat && station.lon) {
        nodes.push({ lat: Number(station.lat), lon: Number(station.lon) });
    } else {
        return;
    }

    if (reception.route && reception.route.length > 0) {
        reception.route.forEach(hop => {
            const hopKey = normalizeCallsign(hop);
            if (positionIndex[hopKey]) {
                nodes.push(positionIndex[hopKey]);
            }
        });
    }

    const rxKey = normalizeCallsign(reception.receiver);
    if (positionIndex[rxKey]) {
        nodes.push(positionIndex[rxKey]);
    }

    for (let i = 0; i < nodes.length - 1; i++) {

        const p1 = nodes[i];
        const p2 = nodes[i + 1];

        if (p1.lat === p2.lat && p1.lon === p2.lon) {
            continue;
        }

        const line = L.polyline(
            [
                [p1.lat, p1.lon],
                [p2.lat, p2.lon]
            ],
            {
                color: "#ff3333",
                weight: 2,
                dashArray: "5, 5",
                opacity: 0.9,
                interactive: false
            }
        );

        line.addTo(map);
        hoverConnectionLines.push(line);
    }
}


/* ============================================================
   AGGIORNA MAPPA
   ============================================================ */


function analyzePath(packet) {

    const raw =
        packet.packet ||
        packet.raw ||
        packet.data ||
        "";

    const result = {
        direct: true,
        via: null,
        internet: false,
        path: []
    };

    const colon = raw.indexOf(":");

    const header =
        colon >= 0
            ? raw.substring(0, colon)
            : raw;

    const gt = header.indexOf(">");

    if (gt < 0) {
        return result;
    }

    const pathText =
        header.substring(gt + 1);

    const path =
        pathText
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    result.path = path;

    for (const item of path) {

        const clean =
            item
                .replace(/\*$/, "")
                .trim()
                .toUpperCase();

        if (
            clean === "TCPIP" ||
            clean === "TCPXX" ||
            clean.startsWith("TCPIP") ||
            clean.startsWith("TCPXX")
        ) {

            result.internet = true;

            return result;
        }
    }

    for (const item of path) {

        if (item.endsWith("*")) {

            result.via =
                item.substring(
                    0,
                    item.length - 1
                ).trim();

            result.direct = false;

            break;
        }
    }

    return result;
}

function getSource(packet) {

    return String(
        packet.callsign ||
        packet.source ||
        packet.src ||
        packet.station ||
        ""
    ).trim();
}

function getReceiver(packet) {

    return String(
        packet.receiver_callsign ||
        ""
    ).trim();
}

function getTime(packet) {

    return (
        packet.received_at ||
        packet.timestamp ||
        packet.time ||
        ""
    );
}



function updateMap(packets) {

    const cutoff =
        Date.now() -
        selectedPeriodHours * 60 * 60 * 1000;

    /*
     * ========================================================
     * PACCHETTI DEL SOLO RICEVITORE
     * ========================================================
     */

    const receivedPackets =
        packets.filter(
            packet =>
                getReceiver(packet).toUpperCase() ===
                RECEIVER.toUpperCase()
        );

    /*
     * ========================================================
     * SOLO RICEZIONI DIRETTE
     *
     * Usa ESATTAMENTE analyzePath() di station.html.
     * ========================================================
     */

    const directPackets =
        receivedPackets.filter(packet => {

            const timeValue = getTime(packet);
            const d = new Date(timeValue);

            if (isNaN(d.getTime())) {
                return false;
            }

            if (d.getTime() < cutoff) {
                return false;
            }

            const info = analyzePath(packet);

            if (info.internet) {
                return false;
            }

            return info.direct;
        });

    /*
     * ========================================================
     * RAGGRUPPA LE STAZIONI
     *
     * Una sola stazione per nominativo.
     * Manteniamo il pacchetto più recente.
     * ========================================================
     */

    const stations = {};

    directPackets.forEach(packet => {

        const callsign = getSource(packet);

        if (!callsign) {
            return;
        }

        const key =
            normalizeCallsign(callsign);

        const position =
            getPacketPosition(packet);

        if (!position) {
            return;
        }

        const packetTime =
            new Date(getTime(packet)).getTime();

        if (
            !stations[key] ||
            packetTime >
            stations[key].time
        ) {

            stations[key] = {

                callsign: callsign,

                lat: position.lat,

                lon: position.lon,

                packet: packet,

                time: packetTime,

                symbol_table:
                    packet.symbol_table ||
                    packet.symbolTable ||
                    "/",

                symbol_code:
                    packet.symbol_code ||
                    packet.symbolCode ||
                    ">"

            };
        }
    });

    /*
     * ========================================================
     * RIMUOVE MARKER NON PIÙ PRESENTI
     * ========================================================
     */

    Object.keys(markers).forEach(key => {

        if (!stations[key]) {

            map.removeLayer(
                markers[key]
            );

            delete markers[key];
        }
    });

    /*
     * ========================================================
     * RIMUOVE LINEE NON PIÙ PRESENTI
     * ========================================================
     */

    Object.keys(coverageLines).forEach(key => {

        if (!stations[key]) {

            map.removeLayer(
                coverageLines[key]
            );

            delete coverageLines[key];
        }
    });

    /*
     * ========================================================
     * DISEGNA STAZIONI E LINEE
     * ========================================================
     */

    const bounds = [
        [
            RECEIVER_LAT,
            RECEIVER_LON
        ]
    ];

    Object.keys(stations).forEach(key => {

        const station =
            stations[key];

        const lat =
            Number(station.lat);

        const lon =
            Number(station.lon);

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
        ) {
            return;
        }

        const latLng =
            [lat, lon];

        bounds.push(latLng);

        /*
         * ----------------------------------------------------
         * MARKER STAZIONE
         * ----------------------------------------------------
         */

        const icon =
            createAPRSIcon(
                station.callsign,
                station.packet,
                station
            );

        if (markers[key]) {

            markers[key].setLatLng(
                latLng
            );

            markers[key].setIcon(
                icon
            );

        } else {

            const marker =
                L.marker(
                    latLng,
                    {
                        icon: icon
                    }
                );

            marker.on(
                "click",
                () => {

                    window.location.href =
                        "station.html?callsign=" +
                        encodeURIComponent(
                            station.callsign
                        );
                }
            );

            marker.addTo(map);

            markers[key] =
                marker;
        }

        /*
         * ----------------------------------------------------
         * LINEA STAZIONE -> RICEVITORE
         * ----------------------------------------------------
         */

        const linePoints = [
            [
                RECEIVER_LAT,
                RECEIVER_LON
            ],
            [
                lat,
                lon
            ]
        ];

        if (coverageLines[key]) {

            coverageLines[key]
                .setLatLngs(linePoints);

        } else {

            coverageLines[key] =
                L.polyline(
                    linePoints,
                    {
                        color: "#ff3333",
                        weight: 2,
                        opacity: 0.75,
                        dashArray: "7,5",
                        interactive: false
                    }
                ).addTo(map);
        }
    });


    /*
     * ========================================================
     * MARKER DEL RICEVITORE
     *
     * Viene visualizzato come una normale stazione APRS.
     * ========================================================
     */

    let receiverPacket = null;

    for (const packet of packets) {

        const source =
            getSource(packet);

        if (
            source.toUpperCase() ===
            RECEIVER.toUpperCase()
        ) {

            const position =
                getPacketPosition(packet);

            if (position) {

                receiverPacket = packet;
                break;
            }
        }
    }

    /*
     * Se il ricevitore ha trasmesso almeno un proprio
     * pacchetto con posizione, utilizziamo il suo simbolo APRS.
     *
     * Altrimenti usiamo il simbolo di default.
     */

    const receiverStation = {

        callsign: RECEIVER,

        lat: RECEIVER_LAT,

        lon: RECEIVER_LON,

        symbol_table:
            receiverPacket &&
            (
                receiverPacket.symbol_table ||
                receiverPacket.symbolTable
            )
            || "/",

        symbol_code:
            receiverPacket &&
            (
                receiverPacket.symbol_code ||
                receiverPacket.symbolCode
            )
            || ">",

        packet:
            receiverPacket || null
    };

    const receiverIcon =
        createAPRSIcon(
            RECEIVER,
            receiverPacket,
            receiverStation
        );

    if (markers["RECEIVER"]) {

        markers["RECEIVER"]
            .setLatLng(
                [
                    RECEIVER_LAT,
                    RECEIVER_LON
                ]
            );

        markers["RECEIVER"]
            .setIcon(receiverIcon);

    }
    else {

        const receiverMarker =
            L.marker(
                [
                    RECEIVER_LAT,
                    RECEIVER_LON
                ],
                {
                    icon: receiverIcon,
                    zIndexOffset: 2000
                }
            );

        receiverMarker.on(
            "click",
            () => {

                window.location.href =
                    "station.html?callsign=" +
                    encodeURIComponent(
                        RECEIVER
                    );
            }
        );

        receiverMarker.addTo(map);

        markers["RECEIVER"] =
            receiverMarker;
    }

    bounds.push(
        [
            RECEIVER_LAT,
            RECEIVER_LON
        ]
    );

    /*
     * ========================================================
     * STATO
     * ========================================================
     */

    document.getElementById("status")
        .textContent =
            "Dirette: " +
            Object.keys(stations).length;

    /*
     * ========================================================
     * ADATTA LA MAPPA ALLE STAZIONI
     * ========================================================
     */

    if (
        firstLoad &&
        bounds.length > 1
    ) {

        map.fitBounds(
            bounds,
            {
                padding: [60, 60]
            }
        );

        firstLoad = false;
    }
}




/* ============================================================
   RICEVITORE DINAMICO
   ============================================================ */

async function initializeReceiver() {

    const response =
        await fetch(
            API + "/status",
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            "Errore API status: HTTP " +
            response.status
        );
    }

    const data =
        await response.json();

    const receivers =
        Array.isArray(data.receivers)
            ? data.receivers.filter(
                receiver =>
                    receiver.enabled !== false
            )
            : [];

    const menu =
        document.getElementById(
            "receiverMenuContent"
        );

    if (menu) {

        menu.innerHTML = "";

        receivers.forEach(receiver => {

            const link =
                document.createElement("a");

            link.href =
                "coverage.html?receiver=" +
                encodeURIComponent(
                    receiver.callsign
                );

            link.textContent =
                "📡 " + receiver.callsign;

            menu.appendChild(link);
        });
    }

    let selected = null;

    if (REQUESTED_RECEIVER) {

        selected =
            receivers.find(
                receiver =>
                    String(receiver.callsign)
                        .toUpperCase() ===
                    String(REQUESTED_RECEIVER)
                        .toUpperCase()
            );
    }

    if (!selected && receivers.length > 0) {
        selected = receivers[0];
    }

    if (!selected) {
        throw new Error(
            t("Nessun ricevitore configurato", "No receiver configured")
        );
    }

    RECEIVER =
        selected.callsign;

    RECEIVER_LAT =
        Number(selected.latitude);

    RECEIVER_LON =
        Number(selected.longitude);

    document.title =
        t("Copertura ", "Coverage ") +
        RECEIVER +
        " - LoRa APRS Maps MQTT";

    const title =
        document.getElementById(
            "coverageReceiverTitle"
        );

    if (title) {
        title.textContent = RECEIVER;
    }

    if (
        !Number.isFinite(RECEIVER_LAT) ||
        !Number.isFinite(RECEIVER_LON)
    ) {

        throw new Error(
            t("Posizione del ricevitore ", "Receiver position for ") +
            RECEIVER +
            t(
                " non disponibile. Verificare che nel database esista almeno un beacon APRS con posizione trasmesso dal ricevitore.",
                " is not available. Check that the database contains at least one APRS beacon with a position transmitted by the receiver."
            )
        );
    }
}


async function startCoveragePage() {

    const status =
        document.getElementById("status");

    try {

        if (status) {
            status.textContent =
                t("Caricamento ricevitore...", "Loading receiver...");
        }

        await initializeReceiver();

        await loadPackets();


    }
    catch (error) {

        console.error(error);

        if (status) {
            status.textContent =
                t("Errore: ", "Error: ") +
                error.message;

            status.classList.add("error");
        }
    }
}

        selectedPeriodHours = parseFloat(e.target.value) || 1;

startCoveragePage();
