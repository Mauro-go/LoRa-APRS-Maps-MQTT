<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - LoRa APRS Maps MQTT</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0f172a;
    color: #e5e7eb;
}
header {
    background: #111827;
    padding: 20px 30px;
    border-bottom: 1px solid #334155;
}
header h1 { margin: 0; font-size: 28px; }
header p { margin: 6px 0 0; color: #94a3b8; }
.header-actions { margin-top: 12px; }
.button {
    display: inline-block;
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    background: #334155;
    border: 1px solid #475569;
    border-radius: 6px;
    font-size: 12px;
}
.button:hover { background: #475569; }
.container {
    max-width: 1500px;
    margin: auto;
    padding: 25px;
}
.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 25px;
}
.card, .receiver, .station-column, .section {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 10px;
}
.card { padding: 20px; }
.card-title { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
.card-value { font-size: 32px; font-weight: bold; }
.receivers {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
    gap: 18px;
    margin-bottom: 25px;
}
.receiver { padding: 20px; }
.receiver-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 15px;
}
.receiver-name { font-size: 20px; font-weight: bold; }
.receiver-actions { display:flex; align-items:center; gap:8px; }
.status { font-size: 12px; color:#94a3b8; }
.dot {
    display:inline-block; width:10px; height:10px; border-radius:50%;
    background:#64748b; margin-right:5px;
}
.dot.active { background:#22c55e; box-shadow:0 0 8px #22c55e; }
.receiver-stats {
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px;
}
.receiver-stat {
    background:#0f172a; border-radius:7px; padding:12px;
}
.receiver-stat-title { color:#94a3b8; font-size:11px; }
.receiver-stat-value { margin-top:5px; font-size:17px; font-weight:bold; }
.section { padding:20px; margin-bottom:25px; }
.section h2 { margin-top:0; }
.station-columns {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(380px,1fr));
    gap:18px;
}
.station-column { overflow:hidden; }
.station-column-title {
    padding:13px 15px;
    background:#111827;
    border-bottom:1px solid #334155;
    font-size:17px;
    font-weight:bold;
}
.station-count { color:#94a3b8; font-size:12px; font-weight:normal; margin-left:6px; }
.table-wrap { overflow-x:auto; max-height:480px; overflow-y:auto; }
table { width:100%; border-collapse:collapse; }
th {
    text-align:left; color:#94a3b8; font-size:12px;
    padding:10px; border-bottom:1px solid #334155;
    position:sticky; top:0; background:#111827;
}
td { padding:10px; border-bottom:1px solid #273449; font-size:13px; }
tr:hover { background:#263449; }
.callsign { font-weight:bold; color:#38bdf8; }
.packet { font-family:monospace; font-size:12px; color:#cbd5e1; word-break:break-all; }
.time { white-space:nowrap; color:#94a3b8; }
.error {
    display:none; margin-bottom:20px; padding:15px;
    background:#450a0a; border:1px solid #991b1b;
    color:#fecaca; border-radius:8px;
}
@media (max-width:900px) {
    .cards { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:600px) {
    .cards { grid-template-columns:1fr; }
    .container { padding:12px; }
    .station-columns { grid-template-columns:1fr; }
    .receiver-stats { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<header>
    <h1>📡 LoRa APRS Maps MQTT</h1>
    <p>Dashboard ricevitori LoRa APRS via MQTT</p>
    <div class="header-actions">
        <a href="index.html" class="button">🏠 Home</a>
    </div>
</header>

<div class="container">
    <div id="error" class="error"></div>

    <div class="cards">
        <div class="card">
            <div class="card-title">Pacchetti totali</div>
            <div class="card-value" id="totalPackets">-</div>
        </div>
        <div class="card">
            <div class="card-title">Stazioni uniche</div>
            <div class="card-value" id="uniqueStations">-</div>
        </div>
        <div class="card">
            <div class="card-title">Pacchetti ultime 24h</div>
            <div class="card-value" id="packets24h">-</div>
        </div>
        <div class="card">
            <div class="card-title">Ricevitori configurati</div>
            <div class="card-value" id="receiverCount">-</div>
        </div>
    </div>

    <div class="receivers" id="receivers"></div>

    <div class="section">
        <h2>📻 Stazioni ricevute per ricevitore</h2>
        <div class="station-columns" id="stationColumns"></div>
    </div>

    <div class="section">
        <h2>📨 Ultimi pacchetti</h2>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Ora</th>
                        <th>Ricevitore</th>
                        <th>Stazione</th>
                        <th>Packet</th>
                    </tr>
                </thead>
                <tbody id="packetsTable"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
const API = "/lora-api";
const REFRESH_INTERVAL = 10000;

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatTime(timestamp) {
    if (!timestamp) return "-";
    const date = new Date(timestamp);
    return isNaN(date.getTime())
        ? timestamp
        : date.toLocaleString("it-IT");
}

function showError(message) {
    const e = document.getElementById("error");
    e.textContent = message;
    e.style.display = "block";
}

function hideError() {
    document.getElementById("error").style.display = "none";
}

async function getJson(url) {
    const response = await fetch(url, {cache:"no-store"});
    if (!response.ok) {
        throw new Error(url + " -> HTTP " + response.status);
    }
    return response.json();
}

async function loadStats() {
    const data = await getJson(API + "/stats");
    document.getElementById("totalPackets").textContent = data.total_packets;
    document.getElementById("uniqueStations").textContent = data.unique_stations;
    document.getElementById("packets24h").textContent = data.packets_24h;
}

async function loadReceiversAndStations() {
    const data = await getJson(API + "/status");
    const receivers = Array.isArray(data.receivers)
        ? data.receivers.filter(r => r.enabled !== false)
        : [];

    document.getElementById("receiverCount").textContent = receivers.length;

    const receiverContainer = document.getElementById("receivers");
    const stationContainer = document.getElementById("stationColumns");
    receiverContainer.innerHTML = "";
    stationContainer.innerHTML = "";

    await Promise.all(receivers.map(async receiver => {
        const card = document.createElement("div");
        card.className = "receiver";
        card.innerHTML = `
            <div class="receiver-header">
                <div class="receiver-name">📡 ${escapeHtml(receiver.callsign)}</div>
                <div class="receiver-actions">
                    <a class="button"
                       href="coverage.html?receiver=${encodeURIComponent(receiver.callsign)}">
                       🗺️ Mappa Copertura
                    </a>
                    <span class="status">
                        <span class="dot ${receiver.packets > 0 ? "active" : ""}"></span>
                        ${receiver.packets > 0 ? "Attivo" : "In attesa"}
                    </span>
                </div>
            </div>
            <div class="receiver-stats">
                <div class="receiver-stat">
                    <div class="receiver-stat-title">Pacchetti</div>
                    <div class="receiver-stat-value">${receiver.packets}</div>
                </div>
                <div class="receiver-stat">
                    <div class="receiver-stat-title">Stazioni</div>
                    <div class="receiver-stat-value">${receiver.stations}</div>
                </div>
                <div class="receiver-stat">
                    <div class="receiver-stat-title">Ultimo pacchetto</div>
                    <div class="receiver-stat-value" style="font-size:12px">
                        ${escapeHtml(formatTime(receiver.last_packet))}
                    </div>
                </div>
            </div>
        `;
        receiverContainer.appendChild(card);

        const stationData = await getJson(
            API + "/stations?receiver=" +
            encodeURIComponent(receiver.callsign) +
            "&limit=500"
        );

        const stations = Array.isArray(stationData.stations)
            ? stationData.stations
            : [];

        const column = document.createElement("div");
        column.className = "station-column";

        const rows = stations.map(station => `
            <tr>
                <td class="callsign">${escapeHtml(station.callsign)}</td>
                <td>${station.packets}</td>
                <td class="time">${escapeHtml(formatTime(station.last_seen))}</td>
            </tr>
        `).join("");

        column.innerHTML = `
            <div class="station-column-title">
                ${escapeHtml(receiver.callsign)}
                <span class="station-count">(${stations.length} stazioni)</span>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Callsign</th>
                            <th>Pacchetti</th>
                            <th>Ultimo ascolto</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>
        `;

        stationContainer.appendChild(column);
    }));
}

async function loadPackets() {
    const data = await getJson(API + "/packets?limit=50");
    const packets = Array.isArray(data.packets) ? data.packets : [];
    const table = document.getElementById("packetsTable");
    table.innerHTML = packets.map(packet => `
        <tr>
            <td class="time">${escapeHtml(formatTime(packet.timestamp))}</td>
            <td>${escapeHtml(packet.receiver_callsign)}</td>
            <td class="callsign">${escapeHtml(packet.callsign)}</td>
            <td class="packet">${escapeHtml(packet.packet)}</td>
        </tr>
    `).join("");
}

async function refresh() {
    try {
        hideError();
        await Promise.all([
            loadStats(),
            loadReceiversAndStations(),
            loadPackets()
        ]);
    } catch (error) {
        console.error(error);
        showError("Impossibile collegarsi all'API LoRa APRS: " + error.message);
    }
}

refresh();
setInterval(refresh, REFRESH_INTERVAL);
</script>
</body>
</html>
