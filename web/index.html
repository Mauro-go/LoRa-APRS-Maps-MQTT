<title>LoRa APRS by IV3SCP</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
}

#map {
    width: 100%;
    height: 100%;
}

/* ======================================================
   HEADER
   ====================================================== */

.topbar {
    position: absolute;
    z-index: 1000;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    color: white;
    background: rgba(20,20,20,.90);
    border-radius: 7px;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
}

.title {
    font-size: 18px;
    font-weight: bold;
}

.subtitle {
    margin-left: 8px;
    color: #aaa;
    font-size: 12px;
}

.status {
    font-size: 11px;
    color: #8fd18f;
}

.status.error {
    color: #ff7777;
}

.period-select {
    margin-left: 12px;
    padding: 5px 8px;
    border: 1px solid #555;
    border-radius: 5px;
    background: #2a2a2a;
    color: white;
    font-size: 11px;
    cursor: pointer;
}

.period-select:focus {
    outline: none;
    border-color: #888;
}

/* ======================================================
   APRS MARKER
   ====================================================== */

.aprs-marker {
    position: relative;
    width: 24px;
    height: 24px;
    pointer-events: auto;
    cursor: pointer;
}

.aprs-symbol {
    position: absolute;
    left: 0;
    top: 0;
    width: 24px;
    height: 24px;
    background-repeat: no-repeat;
    display: block;
}

.aprs-overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: bold;
    line-height: 24px;
    pointer-events: none;
    text-shadow: 0 0 1px rgba(0,0,0,.9);
}

.aprs-overlay.wx {
    color: #008cff;
}

.aprs-overlay.lora {
    color: white;
}

.callsign {
    position: absolute;
    left: 27px;
    top: 2px;
    padding: 1px 3px;
    white-space: nowrap;
    color: #111;
    background: rgba(255,255,255,.90);
    border-radius: 2px;
    font-size: 10px;
    font-weight: bold;
    box-shadow: 0 1px 2px rgba(0,0,0,.3);
    pointer-events: none;
}

/* ======================================================
   PUNTI STORICI
   ====================================================== */

.track-point {
    cursor: pointer;
}

.leaflet-control-attribution {
    font-size: 10px;
}


/* ======================================================
   RICEZIONE LIVE
   ====================================================== */

.leaflet-marker-icon.live-rx-flash .aprs-symbol {
    animation: liveRxSymbol 1.8s ease-out;
}

.leaflet-marker-icon.live-rx-flash .callsign {
    animation: liveRxLabel 1.8s ease-out;
}

@keyframes liveRxSymbol {
    0% { filter: drop-shadow(0 0 0 rgba(0,191,255,0)) brightness(1); transform: scale(1); }
    18% { filter: drop-shadow(0 0 10px rgba(0,191,255,1)) drop-shadow(0 0 18px rgba(0,191,255,.85)) brightness(1.8); transform: scale(1.30); }
    45% { filter: drop-shadow(0 0 7px rgba(0,191,255,.9)) brightness(1.45); transform: scale(1.12); }
    100% { filter: drop-shadow(0 0 0 rgba(0,191,255,0)) brightness(1); transform: scale(1); }
}

@keyframes liveRxLabel {
    0% { box-shadow: 0 1px 2px rgba(0,0,0,.3); }
    18% { box-shadow: 0 0 7px rgba(0,191,255,1), 0 0 14px rgba(0,191,255,.75); }
    100% { box-shadow: 0 1px 2px rgba(0,0,0,.3); }
}

/* ======================================================
   MOBILE
   ====================================================== */

@media (max-width: 700px) {

    .topbar {
        top: 5px;
        left: 5px;
        right: 5px;
        padding: 7px 9px;
    }

    .title {
        font-size: 15px;
    }

    .subtitle {
        display: none;
    }

    .status {
        font-size: 10px;
    }
}


/* ======================================================
   MENU RICEVITORI
   ====================================================== */

.receiver-menu {
    position: relative;
    display: inline-block;
    margin-left: 6px;
}

.receiver-menu-button {
    display: inline-block;
    color: white;
    text-decoration: none;

    background: #333;

}

.receiver-menu-content {

    right: 0;

    min-width: 145px;
    background: rgba(35,35,35,.97);
    border: 1px solid #555;

    box-shadow: 0 3px 12px rgba(0,0,0,.5);
    overflow: hidden;
    z-index: 2000;
}

.receiver-menu-content a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 8px 10px;
    font-size: 11px;
    white-space: nowrap;
}

.receiver-menu-content a:hover {
    background: #444;
}

.receiver-menu:hover .receiver-menu-content {
    display: block;
}


/* ======================================================
   LINGUA IT / EN
   ====================================================== */
.lang-en { display: none; }
html[data-lang="en"] .lang-it { display: none !important; }
html[data-lang="en"] .lang-en { display: inline !important; }

.language-select {
    background: #222;
    color: white;
    border: 1px solid #555;
    border-radius: 4px;
    padding: 4px 6px;

    margin-left: 6px;
}

</style>

            "

            <option value="8" data-it="Ultime 8 ore" data-en="Last 8 hours">Ultime 8 ore</option>
            <option value="12" data-it="Ultime 12 ore" data-en="Last 12 hours">Ultime 12 ore</option>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

/* ============================================================
   LINGUA
   ============================================================ */

let currentLanguage =
    localStorage.getItem("lora-aprs-language") === "en" ? "en" : "it";

function t(it, en) {
    return currentLanguage === "en" ? en : it;
}

function applyLanguage(language) {

    currentLanguage = language === "en" ? "en" : "it";
    document.documentElement.dataset.lang = currentLanguage;
    document.documentElement.lang = currentLanguage;
    localStorage.setItem("lora-aprs-language", currentLanguage);

    const languageSelect = document.getElementById("languageSelect");
    if (languageSelect) languageSelect.value = currentLanguage;

    const periodSelect = document.getElementById("periodSelect");
    if (periodSelect) {
        periodSelect.title =
            currentLanguage === "en"
                ? periodSelect.dataset.titleEn
                : periodSelect.dataset.titleIt;

        Array.from(periodSelect.options).forEach(option => {
            option.textContent =
                currentLanguage === "en"
                    ? option.dataset.en
                    : option.dataset.it;
        });
    }
}

applyLanguage(currentLanguage);


const API = "/lora-api";
const REFRESH_INTERVAL = 10000;
const SYMBOL_PATH = "/aprs-symbols/";

let map;
let markers = {};
let hoverConnectionLines = [];

/*
 * Vista mappa persistente.
 * Manteniamo centro e zoom quando si entra in station.html
 * e poi si ritorna alla home.
 */
const MAP_VIEW_STORAGE_KEY = "loraAprsMapView";

let savedMapView = null;

try {
    const storedMapView =
        localStorage.getItem(MAP_VIEW_STORAGE_KEY);

    if (storedMapView) {
        const parsedMapView =
            JSON.parse(storedMapView);

        if (
            parsedMapView &&
            Number.isFinite(Number(parsedMapView.lat)) &&
            Number.isFinite(Number(parsedMapView.lon)) &&
            Number.isFinite(Number(parsedMapView.zoom))
        ) {
            savedMapView = {
                lat: Number(parsedMapView.lat),
                lon: Number(parsedMapView.lon),
                zoom: Number(parsedMapView.zoom)
            };
        }
    }
}
catch (e) {
    savedMapView = null;
}

let firstLoad = !savedMapView;
let trackLayers = {};
let selectedPeriodHours = 1;

const LIVE_POLL_INTERVAL = 2000;
const LIVE_EFFECT_DURATION = 2300;

let liveLastPacketId = null;
let livePolling = false;
let lastPositionIndex = {};


/* ============================================================
   MAPPA
   ============================================================ */

map = L.map("map", {
    zoomControl: true
});

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors"
    }
).addTo(map);

if (savedMapView) {
    map.setView(
        [savedMapView.lat, savedMapView.lon],
        savedMapView.zoom
    );
}
else {
    map.setView([46.07, 13.24], 7);
}

map.on("moveend zoomend", () => {
    const center = map.getCenter();

    try {
        localStorage.setItem(
            MAP_VIEW_STORAGE_KEY,
            JSON.stringify({
                lat: center.lat,
                lon: center.lng,
                zoom: map.getZoom()
            })
        );
    }
    catch (e) {
        // localStorage non disponibile: nessun problema.
    }
});


/* ============================================================
   DATE
   ============================================================ */

function formatDate(value) {

    if (!value) {
        return "-";
    }

    try {

        const d = new Date(value);

        if (isNaN(d.getTime())) {
            return value;
        }

        return d.toLocaleString(
            currentLanguage === "en" ? "en-GB" : "it-IT",
            {
                dateStyle: "short",
                timeStyle: "medium"
            }
        );

    }
    catch (e) {
        return value;
    }
}


/* ============================================================
   APRS SYMBOL TABLE
   ============================================================ */

const APRS_TRANSLATION = [

    '!"#$%&\'()*+,-./0',
    '123456789:;<=>?@',
    'ABCDEFGHIJKLMNOP',
    'QRSTUVWXYZ[\\]^_`',
    'abcdefghijklmnop',
    'qrstuvwxyz{|}~'

];


function getSymbolPosition(code) {

    if (!code) {
        return null;
    }

    for (
        let row = 0;
        row < APRS_TRANSLATION.length;
        row++
    ) {

        const chars = APRS_TRANSLATION[row];

        const col = chars.indexOf(code);

        if (col !== -1) {

            return {
                row: row,
                col: col
            };
        }
    }

    return null;
}


/* ============================================================
   DECODIFICA SIMBOLO
   ============================================================ */

function decodeSymbol(symbolTable, symbolCode) {

    let table = 0;
    let overlay = null;
    let code = symbolCode;

    if (!symbolCode) {

        return {
            table: 0,
            overlay: null,
            code: ">"
        };
    }

    if (symbolTable === "/") {

        table = 0;
        overlay = null;
    }

    else if (symbolTable === "\\") {

        table = 1;
        overlay = null;
    }

    else if (/^[0-9]$/.test(symbolTable)) {

        table = 1;
        overlay = symbolTable;
    }

    else if (/^[a-j]$/.test(symbolTable)) {

        table = 1;

        overlay =
            String(
                symbolTable.charCodeAt(0) -
                "a".charCodeAt(0)
            );
    }

    else if (/^[A-Z]$/.test(symbolTable)) {

        table = 1;
        overlay = symbolTable;
    }

    else {

        table = 0;
        overlay = null;
    }

    return {
        table: table,
        overlay: overlay,
        code: code
    };
}


/* ============================================================
   CREA SIMBOLO
   ============================================================ */

function createAPRSSymbolElement(
    symbolTable,
    symbolCode
) {

    const decoded =
        decodeSymbol(
            symbolTable,
            symbolCode
        );

    const position =
        getSymbolPosition(
            decoded.code
        );

    const finalPosition =
        position ||
        getSymbolPosition(">");

    const element =
        document.createElement("span");

    element.className =
        "aprs-symbol";

    element.style.backgroundImage =
        "url('" +
        SYMBOL_PATH +
        "aprs-symbols-24-" +
        decoded.table +
        ".png')";

    element.style.backgroundPosition =
        "-" +
        (finalPosition.col * 24) +
        "px -" +
        (finalPosition.row * 24) +
        "px";

    let overlayElement = null;

    if (decoded.overlay) {

        overlayElement =
            document.createElement("span");

        overlayElement.className =
            "aprs-overlay";

        if (
            decoded.overlay === "L" &&
            decoded.code === "_"
        ) {

            overlayElement.classList.add("wx");

        }
        else {

            overlayElement.classList.add("lora");
        }

        overlayElement.textContent =
            decoded.overlay;
    }

    return {
        symbol: element,
        overlay: overlayElement
    };
}


/* ============================================================
   ICONA APRS
   ============================================================ */

function createAPRSIcon(
    callsign,
    packet,
    station
) {

    let symbolTable = "/";
    let symbolCode = ">";

    if (
        station &&
        station.symbol_table !== undefined &&
        station.symbol_table !== null &&
        station.symbol_table !== ""
    ) {

        symbolTable =
            String(
                station.symbol_table
            );
    }

    if (
        station &&
        station.symbol_code !== undefined &&
        station.symbol_code !== null &&
        station.symbol_code !== ""
    ) {

        symbolCode =
            String(
                station.symbol_code
            );
    }

    const symbol =
        createAPRSSymbolElement(
            symbolTable,
            symbolCode
        );

    const marker =
        document.createElement("div");

    marker.className =
        "aprs-marker";

    marker.appendChild(
        symbol.symbol
    );

    if (symbol.overlay) {

        marker.appendChild(
            symbol.overlay
        );
    }

    const label =
        document.createElement("span");

    label.className =
        "callsign";

    label.textContent =
        callsign;

    marker.appendChild(
        label
    );

    return L.divIcon({

        className: "",

        html:
            marker.outerHTML,

        // La hitbox Leaflet coincide con il solo simbolo APRS.
        // Il nominativo resta visibile fuori dall'icona, ma non può
        // intercettare il click destinato a una stazione vicina.
        iconSize:
            [24, 24],

        iconAnchor:
            [12, 12]

    });
}


/* ============================================================
   PERCORSO APRS
   ============================================================ */

function getPacketRoute(packet) {

    const explicitPath =
        packet.path ||
        packet.route ||
        packet.digipeater_path ||
        packet.digipeaters ||
        packet.via ||
        null;

    if (Array.isArray(explicitPath)) {

        return explicitPath
            .map(value => String(value).trim())
            .filter(Boolean);
    }

    if (
        explicitPath !== null &&
        explicitPath !== undefined &&
        String(explicitPath).trim() !== ""
    ) {

        return String(explicitPath)
            .split(",")
            .map(value => value.trim())
            .filter(Boolean);
    }

    const raw =
        packet.packet ||
        packet.raw ||
        packet.data ||
        "";

    if (!raw) {
        return [];
    }

    const text =
        String(raw).trim();

    const headerMatch =
        text.match(/^[^>\s]+>([^:]+)/);

    if (!headerMatch) {
        return [];
    }

    const fields =
        headerMatch[1]
            .split(",")
            .map(value => value.trim())
            .filter(Boolean);

    if (fields.length <= 1) {
        return [];
    }

    return fields
        .slice(1)
        .filter(
            value =>
                value &&
                !/^TCPIP/i.test(value) &&
                !/^q[A-Z]/.test(value)
        );
}


/* ============================================================
   RICEZIONE / VIA
   ============================================================ */

function getReceivedDescription(packet) {

    const receiver =
        packet.receiver_callsign ||
        packet.receiver ||
        "-";

    const route =
        getPacketRoute(packet);

    let via = null;

    if (route.length > 0) {

        via =
            String(
                route[route.length - 1]
            )
                .trim()
                .replace(/\*$/, "");
    }

    return {
        receiver: String(receiver)
            .trim()
            .replace(/\*$/, ""),

        via: via,

        route: route
    };
}


/* ============================================================
   CARICAMENTO PACCHETTI
   ============================================================ */

async function loadPackets() {

    const status =
        document.getElementById("status");

    try {

        status.textContent =
            t("Aggiornamento...", "Updating...");

        status.classList.remove("error");

        const response =
            await fetch(
                API + "/packets?limit=500",
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }

        const data =
            await response.json();

        let packets;

        if (Array.isArray(data)) {
            packets = data;
        }

        else if (Array.isArray(data.packets)) {
            packets = data.packets;
        }

        else if (Array.isArray(data.data)) {
            packets = data.data;
        }

        else {
            packets = [];
        }

        updateMap(packets);

        status.textContent =
            "Online · " +
            new Date().toLocaleTimeString(
                currentLanguage === "en" ? "en-GB" : "it-IT"
            );

    }

    catch (error) {

        console.error(error);

        status.textContent =
            t("Errore API", "API error");

        status.classList.add("error");
    }
}


/* ============================================================
   FILTRO TEMPORALE
   ============================================================ */

function getPacketTime(packet) {

    const value =
        packet.received_at ||
        packet.timestamp ||
        packet.time ||
        null;

    if (!value) {
        return null;
    }

    const date =
        new Date(value);

    if (isNaN(date.getTime())) {
        return null;
    }

    return date;
}


function filterPacketsByPeriod(packets) {

    const now =
        Date.now();

    const periodMs =
        selectedPeriodHours *
        60 *
        60 *
        1000;

    const minimumTime =
        now - periodMs;

    return packets.filter(packet => {

        const date =
            getPacketTime(packet);

        if (!date) {
            return false;
        }

        return (
            date.getTime() >=
            minimumTime
        );
    });
}


/* ============================================================
   POSIZIONE PACCHETTO
   ============================================================ */

function getPacketPosition(packet) {

    let lat = null;
    let lon = null;

    if (
        packet.latitude !== undefined &&
        packet.longitude !== undefined &&
        packet.latitude !== null &&
        packet.longitude !== null
    ) {

        lat =
            parseFloat(packet.latitude);

        lon =
            parseFloat(packet.longitude);

    }

    else if (
        packet.lat !== undefined &&
        packet.lon !== undefined &&
        packet.lat !== null &&
        packet.lon !== null
    ) {

        lat =
            parseFloat(packet.lat);

        lon =
            parseFloat(packet.lon);
    }

    if (
        !Number.isFinite(lat) ||
        !Number.isFinite(lon)
    ) {

        return null;
    }

    if (
        lat < -90 ||
        lat > 90 ||
        lon < -180 ||
        lon > 180
    ) {

        return null;
    }

    return {
        lat: lat,
        lon: lon
    };
}


/* ============================================================
   CLEAR TRACCE
   ============================================================ */

function clearTrackLayers() {

    Object.keys(trackLayers)
        .forEach(callsign => {

            const layer =
                trackLayers[callsign];

            if (!layer) {
                return;
            }

            if (layer.line) {
                map.removeLayer(layer.line);
            }

            if (
                layer.points &&
                Array.isArray(layer.points)
            ) {

                layer.points.forEach(point => {
                    map.removeLayer(point);
                });
            }
        });

    trackLayers = {};
}


/* ============================================================
   TRACCE STORICHE
   ============================================================ */

function getTrackReceptionInfo(packet) {

    const receiver =
        normalizeCallsign(
            packet.receiver_callsign ||
            packet.receiver ||
            "-"
        );

    const route =
        getPacketRoute(packet);

    let via = null;

    route.forEach(hop => {

        const text =
            String(hop || "").trim();

        if (!text.endsWith("*")) {
            return;
        }

        const clean =
            normalizeCallsign(text);

        if (
            !clean ||
            clean === receiver ||
            /^WIDE\d/i.test(clean) ||
            /^TRACE\d/i.test(clean)
        ) {
            return;
        }

        via = clean;
    });

    return {
        receiver: receiver || "-",
        via: via
    };
}


function updateTracks(stations) {

    clearTrackLayers();

    Object.values(stations)
        .forEach(station => {

            const callsign =
                station.callsign;

            const positionedPackets =
                station.packets
                    .map(packet => {

                        const position =
                            getPacketPosition(packet);

                        if (!position) {
                            return null;
                        }

                        return {
                            packet: packet,
                            position: position,
                            time: getPacketTime(packet)
                        };
                    })
                    .filter(item => item !== null);

            positionedPackets.sort((a, b) => {

                const ta =
                    a.time
                        ? a.time.getTime()
                        : 0;

                const tb =
                    b.time
                        ? b.time.getTime()
                        : 0;

                return ta - tb;
            });

            if (
                positionedPackets.length === 0
            ) {
                return;
            }

            const latLngs =
                positionedPackets.map(item => [
                    item.position.lat,
                    item.position.lon
                ]);

            const line =
                L.polyline(
                    latLngs,
                    {
                        color: "green",
                        weight: 3,
                        opacity: 0.75,
                        interactive: false
                    }
                );

            line.addTo(map);

            const points = [];

            positionedPackets.forEach(item => {

                const point =
                    L.circleMarker(
                        [
                            item.position.lat,
                            item.position.lon
                        ],
                        {
                            radius: 4,
                            color: "green",
                            weight: 1,
                            fillColor: "white",
                            fillOpacity: 0.9,
                            className: "track-point"
                        }
                    );

                const reception =
                    getTrackReceptionInfo(
                        item.packet
                    );

                const popupHtml = `
                    <div style="min-width:180px;line-height:1.35">
                        <div style="font-weight:bold;font-size:13px;margin-bottom:4px">
                            ${callsign}
                        </div>
                        <div>
                            <b>Ora:</b> ${formatDate(getPacketTime(item.packet))}
                        </div>
                        <div>
                            <b>Ricevuto da:</b> ${reception.receiver}
                        </div>
                        ${
                            reception.via
                                ? `<div><b>Via:</b> ${reception.via}</div>`
                                : `<div><b>Diretta</b></div>`
                        }
                    </div>
                `;

                point.bindPopup(
                    popupHtml,
                    {
                        closeButton: false,
                        autoPan: false,
                        offset: [0, -5]
                    }
                );

                point.on("mouseover", () => {
                    point.openPopup();
                });

                point.on("mouseout", () => {
                    point.closePopup();
                });

                point.on("click", () => {
                    window.location.href = "station.html?callsign=" + encodeURIComponent(callsign);
                });

                point.addTo(map);

                points.push(point);
            });

            trackLayers[callsign] = {
                line: line,
                points: points
            };

        });
}


/* ============================================================
   HOVER CONNECTION
   ============================================================ */

function clearHoverConnection() {

    if (
        !hoverConnectionLines ||
        !Array.isArray(hoverConnectionLines)
    ) {
        hoverConnectionLines = [];
        return;
    }

    hoverConnectionLines.forEach(line => {

        if (!line) {
            return;
        }

        try {
            map.removeLayer(line);
        }
        catch (e) {
            console.warn(
                "Errore rimozione linea hover:",
                e
            );
        }
    });

    hoverConnectionLines = [];
}


/* ============================================================
   NORMALIZZA CALLSIGN
   ============================================================ */

function normalizeCallsign(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .trim()
        .toUpperCase()
        .replace(/\*$/, "");
}


/* ============================================================
   INDICE POSIZIONI
   ============================================================ */

function buildPositionIndex(packets, stations) {

    const index = {};

    Object.values(stations)
        .forEach(station => {

            if (
                Number.isFinite(
                    Number(station.lat)
                ) &&
                Number.isFinite(
                    Number(station.lon)
                )
            ) {

                index[
                    normalizeCallsign(
                        station.callsign
                    )
                ] = {
                    lat: Number(station.lat),
                    lon: Number(station.lon)
                };
            }
        });

    const sortedPackets =
        [...packets].sort((a, b) => {

            const ta =
                getPacketTime(a);

            const tb =
                getPacketTime(b);

            const va =
                ta ? ta.getTime() : 0;

            const vb =
                tb ? tb.getTime() : 0;

            return vb - va;
        });

    sortedPackets.forEach(packet => {

        const callsign =
            packet.callsign ||
            packet.source ||
            packet.src ||
            packet.station;

        const position =
            getPacketPosition(packet);

        if (
            callsign &&
            position
        ) {

            const key =
                normalizeCallsign(
                    callsign
                );

            if (!index[key]) {

                index[key] = {
                    lat: position.lat,
                    lon: position.lon
                };
            }
        }

    });

    packets.forEach(packet => {

        const receiver =
            packet.receiver_callsign ||
            packet.receiver;

        if (!receiver) {
            return;
        }

        let lat = null;
        let lon = null;

        if (
            packet.receiver_latitude !== undefined &&
            packet.receiver_longitude !== undefined
        ) {

            lat =
                parseFloat(
                    packet.receiver_latitude
                );

            lon =
                parseFloat(
                    packet.receiver_longitude
                );
        }

        else if (
            packet.receiver_lat !== undefined &&
            packet.receiver_lon !== undefined
        ) {

            lat =
                parseFloat(
                    packet.receiver_lat
                );

            lon =
                parseFloat(
                    packet.receiver_lon
                );
        }

        if (
            Number.isFinite(lat) &&
            Number.isFinite(lon) &&
            lat >= -90 &&
            lat <= 90 &&
            lon >= -180 &&
            lon <= 180
        ) {

            index[
                normalizeCallsign(receiver)
            ] = {
                lat: lat,
                lon: lon
            };
        }
    });

    return index;
}


/* ============================================================
   RICEZIONE LIVE
   ============================================================ */

function getLivePosition(callsign, packet = null) {
    const key = normalizeCallsign(callsign);
    if (!key) return null;

    if (lastPositionIndex[key]) {
        return {
            lat: Number(lastPositionIndex[key].lat),
            lon: Number(lastPositionIndex[key].lon)
        };
    }

    if (markers[key]) {
        const latLng = markers[key].getLatLng();
        if (latLng) {
            return { lat: Number(latLng.lat), lon: Number(latLng.lng) };
        }
    }

    if (packet) {
        const lat = Number(packet.latitude ?? packet.lat ?? packet.last_known_latitude);
        const lon = Number(packet.longitude ?? packet.lon ?? packet.last_known_longitude);
        if (Number.isFinite(lat) && Number.isFinite(lon)) {
            return { lat: lat, lon: lon };
        }
    }

    return null;
}


function flashLiveReceiver(receiver) {
    const key = normalizeCallsign(receiver);
    if (!key || !markers[key]) return;

    const element = markers[key].getElement();
    if (!element) return;

    element.classList.remove("live-rx-flash");
    void element.offsetWidth;
    element.classList.add("live-rx-flash");

    setTimeout(() => {
        element.classList.remove("live-rx-flash");
    }, LIVE_EFFECT_DURATION);
}


function createLiveWave(position, delay) {
    if (!position) return;

    setTimeout(() => {
        const ring = L.circleMarker(
            [position.lat, position.lon],
            {
                radius: 5,
                color: "#00bfff",
                weight: 2,
                opacity: 0.95,
                fillColor: "#00bfff",
                fillOpacity: 0.12,
                interactive: false
            }
        ).addTo(map);

        const start = performance.now();
        const duration = 1250;

        function frame(now) {
            const progress = Math.min(1, (now - start) / duration);
            const radius = 5 + (34 * progress);
            const opacity = 0.95 * (1 - progress);

            ring.setRadius(radius);
            ring.setStyle({
                opacity: opacity,
                fillOpacity: 0.12 * (1 - progress)
            });

            if (progress < 1) {
                requestAnimationFrame(frame);
            } else {
                try { map.removeLayer(ring); } catch (e) {}
            }
        }

        requestAnimationFrame(frame);
    }, delay);
}


function animateReceiverWaves(position) {
    createLiveWave(position, 0);
    createLiveWave(position, 220);
    createLiveWave(position, 440);
}


function drawLiveRoute(packet) {
    if (!packet) return;

    const source = packet.callsign || packet.source || packet.src || packet.station || "";
    const receiver = packet.receiver_callsign || packet.receiver || "";

    const sourcePosition = getLivePosition(source, packet);
    const receiverPosition = getLivePosition(receiver);

    if (receiverPosition) {
        animateReceiverWaves(receiverPosition);
        flashLiveReceiver(receiver);
    }

    if (!sourcePosition || !receiverPosition) return;

    const nodes = [sourcePosition];
    const usedKeys = new Set([normalizeCallsign(source)]);
    const receiverKey = normalizeCallsign(receiver);

    const route = getPacketRoute(packet);

    route.forEach(hop => {
        const text = String(hop).trim();
        if (!text.endsWith("*")) return;

        const hopKey = normalizeCallsign(text);
        if (!hopKey || hopKey === receiverKey || usedKeys.has(hopKey)) return;

        const hopPosition = getLivePosition(hopKey);
        if (!hopPosition) return;

        nodes.push(hopPosition);
        usedKeys.add(hopKey);
    });

    nodes.push(receiverPosition);
    if (nodes.length < 2) return;

    const latLngs = nodes.map(point => [point.lat, point.lon]);

    const glow = L.polyline(latLngs, {
        color: "#ff0000",
        weight: 7,
        opacity: 0.28,
        interactive: false
    }).addTo(map);

    const core = L.polyline(latLngs, {
        color: "#ff0000",
        weight: 3,
        opacity: 1,
        interactive: false
    }).addTo(map);

    let segmentIndex = 0;
    let segmentStart = performance.now();

    const movingDot = L.circleMarker(latLngs[0], {
        radius: 4,
        color: "#ff0000",
        weight: 2,
        fillColor: "#ffffff",
        fillOpacity: 1,
        opacity: 1,
        interactive: false
    }).addTo(map);

    const totalSegments = latLngs.length - 1;
    const segmentDuration = Math.max(420, 1500 / totalSegments);

    function animateDot(now) {
        if (segmentIndex >= totalSegments) return;

        const progress = Math.min(1, (now - segmentStart) / segmentDuration);
        const a = latLngs[segmentIndex];
        const b = latLngs[segmentIndex + 1];

        const lat = a[0] + ((b[0] - a[0]) * progress);
        const lon = a[1] + ((b[1] - a[1]) * progress);

        movingDot.setLatLng([lat, lon]);

        if (progress >= 1) {
            segmentIndex++;
            segmentStart = now;
        }

        if (segmentIndex < totalSegments) {
            requestAnimationFrame(animateDot);
        }
    }

    requestAnimationFrame(animateDot);

    const fadeStart = performance.now();

    function fade(now) {
        const progress = Math.min(1, (now - fadeStart) / LIVE_EFFECT_DURATION);
        let opacity = 1;

        if (progress > 0.60) {
            opacity = 1 - ((progress - 0.60) / 0.40);
        }

        glow.setStyle({ opacity: 0.28 * opacity });
        core.setStyle({ opacity: 1.00 * opacity });
        movingDot.setStyle({ opacity: opacity, fillOpacity: opacity });

        if (progress < 1) {
            requestAnimationFrame(fade);
        } else {
            for (const layer of [glow, core, movingDot]) {
                try { map.removeLayer(layer); } catch (e) {}
            }
        }
    }

    requestAnimationFrame(fade);
}


function animateLivePacket(packet) {
    if (!packet || packet.id === undefined || packet.id === null) return;
    drawLiveRoute(packet);
}


async function pollLivePackets() {
    if (livePolling) return;
    livePolling = true;

    try {
        const response = await fetch(
            API + "/packets?limit=50&_live=" + Date.now(),
            { cache: "no-store" }
        );

        if (!response.ok) return;

        const data = await response.json();
        const packets = Array.isArray(data)
            ? data
            : (Array.isArray(data.packets) ? data.packets : []);

        const validPackets = packets
            .filter(packet => Number.isFinite(Number(packet.id)))
            .sort((a, b) => Number(a.id) - Number(b.id));

        if (!validPackets.length) return;

        const newestId = Number(validPackets[validPackets.length - 1].id);

        if (liveLastPacketId === null) {
            liveLastPacketId = newestId;
            return;
        }

        const fresh = validPackets.filter(
            packet => Number(packet.id) > liveLastPacketId
        );

        liveLastPacketId = Math.max(liveLastPacketId, newestId);

        fresh
            .slice(-12)
            .forEach((packet, index) => {
                setTimeout(() => {
                    animateLivePacket(packet);
                }, index * 220);
            });
    }
    catch (error) {
        console.warn("Live polling APRS:", error);
    }
    finally {
        livePolling = false;
    }
}


/* ============================================================
   DISEGNA TRATTA HOVER
   ============================================================ */

function drawHoverConnections(station, positionIndex) {

    clearHoverConnection();

    if (!station || !station.packets || station.packets.length === 0) {
        return;
    }

    const latest = station.packets[0];
    const reception = getReceivedDescription(latest);

    const nodes = [];

    const srcKey = normalizeCallsign(station.callsign);
    if (positionIndex[srcKey]) {
        nodes.push(positionIndex[srcKey]);
    } else if (station.lat && station.lon) {
        nodes.push({ lat: Number(station.lat), lon: Number(station.lon) });
    } else {
        return;
    }

    if (reception.route && reception.route.length > 0) {
        reception.route.forEach(hop => {
            const hopKey = normalizeCallsign(hop);
            if (positionIndex[hopKey]) {
                nodes.push(positionIndex[hopKey]);
            }
        });
    }

    const rxKey = normalizeCallsign(reception.receiver);
    if (positionIndex[rxKey]) {
        nodes.push(positionIndex[rxKey]);
    }

    for (let i = 0; i < nodes.length - 1; i++) {

        const p1 = nodes[i];
        const p2 = nodes[i + 1];

        if (p1.lat === p2.lat && p1.lon === p2.lon) {
            continue;
        }

        const line = L.polyline(
            [
                [p1.lat, p1.lon],
                [p2.lat, p2.lon]
            ],
            {
                color: "#ff3333",
                weight: 2,
                dashArray: "5, 5",
                opacity: 0.9,
                interactive: false
            }
        );

        line.addTo(map);
        hoverConnectionLines.push(line);
    }
}


/* ============================================================
   AGGIORNA MAPPA
   ============================================================ */

function updateMap(packets) {

    const filteredPackets =
        filterPacketsByPeriod(packets);

    const stations = {};

    filteredPackets.forEach(packet => {

        const callsign =
            packet.callsign ||
            packet.source ||
            packet.src ||
            packet.station;

        if (!callsign) {
            return;
        }

        const normCall = normalizeCallsign(callsign);

        if (!stations[normCall]) {

            const pos = getPacketPosition(packet);

            /*
             * Il filtro temporale stabilisce se la stazione
             * deve comparire.
             *
             * Se il packet recente non contiene posizione
             * o simbolo, utilizziamo l'ultimo valore valido
             * recuperato dall'API direttamente dal database.
             */

            const fallbackLat =
                packet.last_known_latitude !== undefined &&
                packet.last_known_latitude !== null
                    ? Number(packet.last_known_latitude)
                    : null;

            const fallbackLon =
                packet.last_known_longitude !== undefined &&
                packet.last_known_longitude !== null
                    ? Number(packet.last_known_longitude)
                    : null;

            stations[normCall] = {
                callsign: callsign,

                lat:
                    pos
                        ? pos.lat
                        : (
                            Number.isFinite(fallbackLat)
                                ? fallbackLat
                                : null
                        ),

                lon:
                    pos
                        ? pos.lon
                        : (
                            Number.isFinite(fallbackLon)
                                ? fallbackLon
                                : null
                        ),

                symbol_table:
                    packet.symbol_table ||
                    packet.symbolTable ||
                    packet.last_known_symbol_table ||
                    null,

                symbol_code:
                    packet.symbol_code ||
                    packet.symbolCode ||
                    packet.last_known_symbol_code ||
                    null,

                packets: []
            };
        }

        if (!stations[normCall].lat || !stations[normCall].lon) {
            const pos = getPacketPosition(packet);
            if (pos) {
                stations[normCall].lat = pos.lat;
                stations[normCall].lon = pos.lon;
            }
        }


        /*
         * SIMBOLO APRS
         *
         * Se il packet più recente non aveva simbolo,
         * utilizziamo il primo packet successivo che
         * contiene realmente symbol_table + symbol_code.
         *
         * Esempio IV3JBF-10:
         *
         * packet third-party -> nessun simbolo
         * packet !L...&      -> L&
         *
         * In questo modo non viene più trasformato
         * erroneamente nel simbolo /> (automobile).
         */
        if (
            !stations[normCall].symbol_table ||
            !stations[normCall].symbol_code
        ) {

            const packetSymbolTable =
                packet.symbol_table ||
                packet.symbolTable ||
                null;

            const packetSymbolCode =
                packet.symbol_code ||
                packet.symbolCode ||
                null;

            if (
                packetSymbolTable &&
                packetSymbolCode
            ) {

                stations[normCall].symbol_table =
                    String(packetSymbolTable);

                stations[normCall].symbol_code =
                    String(packetSymbolCode);
            }
        }


        stations[normCall].packets.push(packet);

    });

    Object.values(stations).forEach(station => {
        station.packets.sort((a, b) => {
            const ta = getPacketTime(a);
            const tb = getPacketTime(b);
            const va = ta ? ta.getTime() : 0;
            const vb = tb ? tb.getTime() : 0;
            return vb - va;
        });
    });

    const positionIndex = buildPositionIndex(packets, stations);

    lastPositionIndex = positionIndex;

    const currentKeys = Object.keys(stations);

    Object.keys(markers).forEach(key => {
        if (!currentKeys.includes(key)) {
            map.removeLayer(markers[key]);
            delete markers[key];
        }
    });

    const bounds = [];

    currentKeys.forEach(key => {

        const station = stations[key];

        if (!Number.isFinite(station.lat) || !Number.isFinite(station.lon)) {
            return;
        }

        const latLng = [station.lat, station.lon];
        bounds.push(latLng);

        const latestPacket = station.packets[0];

        const icon = createAPRSIcon(
            station.callsign,
            latestPacket,
            station
        );

        if (markers[key]) {

            markers[key].setLatLng(latLng);
            markers[key].setIcon(icon);

        } else {

            const marker = L.marker(latLng, { icon: icon });

            marker.on("click", () => {
                window.location.href = "station.html?callsign=" + encodeURIComponent(station.callsign);
            });

            marker.on("mouseover", () => {
                drawHoverConnections(station, positionIndex);
            });

            marker.on("mouseout", () => {
                clearHoverConnection();
            });

            marker.addTo(map);
            markers[key] = marker;
        }

    });

    updateTracks(stations);

    if (firstLoad && bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50] });
        firstLoad = false;
    }
}


/* ============================================================
   EVENTI ED ESECUZIONE
   ============================================================ */

document
    .getElementById("languageSelect")
    .addEventListener("change", function (e) {
        applyLanguage(e.target.value);
        loadPackets();
    });

document
    .getElementById("periodSelect")
    .addEventListener("change", function (e) {
        selectedPeriodHours = parseFloat(e.target.value) || 1;
        loadPackets();
    });

loadPackets();
setInterval(loadPackets, REFRESH_INTERVAL);

setTimeout(pollLivePackets, 700);
setInterval(pollLivePackets, LIVE_POLL_INTERVAL);

</script>
