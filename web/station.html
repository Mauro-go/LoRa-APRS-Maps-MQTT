<script>

/* ============================================================
   CONFIGURAZIONE
   ============================================================ */

const API = "/lora-api";

let currentLanguage =
    localStorage.getItem("lora-aprs-language") === "en"
        ? "en"
        : "it";


function t(it, en) {
    return currentLanguage === "en" ? en : it;
}


function applyLanguage(language) {

    currentLanguage =
        language === "en" ? "en" : "it";

    document.documentElement.dataset.lang =
        currentLanguage;

    document.documentElement.lang =
        currentLanguage;

    localStorage.setItem(
        "lora-aprs-language",
        currentLanguage
    );

    const languageSelect =
        document.getElementById("languageSelect");

    if (languageSelect) {
        languageSelect.value =
            currentLanguage;
    }
}


applyLanguage(currentLanguage);



const params = new URLSearchParams(window.location.search);

const callsign = params.get("callsign");

const stationHours =
    Math.max(
        1,
        parseFloat(
            params.get("hours") || "168"
        ) || 168
    );


/* ============================================================
   UTILITY
   ============================================================ */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(value) {

    if (!value) {
        return "-";
    }

    const d = new Date(value);

    if (isNaN(d.getTime())) {
        return value;
    }

    return d.toLocaleString(
        currentLanguage === "en"
            ? "en-GB"
            : "it-IT",
        {
            dateStyle: "short",
            timeStyle: "medium"
        }
    );
}


/* ============================================================
   PATH APRS
   ============================================================ */

function analyzePath(packet) {

    const raw =
        packet.packet ||
        packet.raw ||
        packet.data ||
        "";

    const result = {
        direct: true,
        via: null,
        internet: false,
        path: []
    };

    const colon = raw.indexOf(":");

    const header =
        colon >= 0
            ? raw.substring(0, colon)
            : raw;

    const gt = header.indexOf(">");

    if (gt < 0) {
        return result;
    }

    const pathText =
        header.substring(gt + 1);

    const path =
        pathText
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);

    result.path = path;

    for (const item of path) {

        const clean =
            item
                .replace(/\*$/, "")
                .trim()
                .toUpperCase();

        if (
            clean === "TCPIP" ||
            clean === "TCPXX" ||
            clean.startsWith("TCPIP") ||
            clean.startsWith("TCPXX")
        ) {

            result.internet = true;

            return result;
        }
    }

    for (const item of path) {

        if (item.endsWith("*")) {

            result.via =
                item.substring(
                    0,
                    item.length - 1
                ).trim();

            result.direct = false;

            break;
        }
    }

    return result;
}


/* ============================================================
   TRANSITI VIA DIGIPEATER
   ============================================================ */

function getAprsFrames(rawPacket) {

    const frames = [];

    function walk(raw, depth) {

        if (!raw || depth > 3) {
            return;
        }

        const colon = raw.indexOf(":");

        if (colon < 0) {
            return;
        }

        const header = raw.substring(0, colon);
        const payload = raw.substring(colon + 1);
        const gt = header.indexOf(">");

        if (gt >= 0) {

            const source = header.substring(0, gt).trim();
            const right = header.substring(gt + 1);
            const parts = right
                .split(",")
                .map(x => x.trim())
                .filter(Boolean);

            frames.push({
                source,
                destination: parts[0] || "",
                path: parts.slice(1)
            });
        }

        if (payload.startsWith("}")) {
            walk(payload.substring(1), depth + 1);
        }
    }

    walk(String(rawPacket || ""), 0);

    return frames;
}


function getTransitInfo(packet, targetCallsign) {

    const raw =
        packet.packet ||
        packet.raw ||
        packet.data ||
        "";

    const target =
        String(targetCallsign || "")
            .trim()
            .toUpperCase();

    if (!raw || !target) {
        return null;
    }

    const frames = getAprsFrames(raw);

    for (const frame of frames) {

        for (const item of frame.path) {

            const clean =
                String(item)
                    .trim()
                    .toUpperCase();

            if (!clean.endsWith("*")) {
                continue;
            }

            const hop =
                clean.substring(0, clean.length - 1).trim();

            if (hop === target) {

                return {
                    source: frame.source || "-",
                    path: frame.path,
                    receiver: String(
                        packet.receiver_callsign || ""
                    ).trim()
                };
            }
        }
    }

    return null;
}


/* ============================================================
   SIMBOLO APRS
   ============================================================ */

function getStationSymbolHtml(
    symbolTable,
    symbolCode
) {

    if (!symbolTable || !symbolCode) {
        return "";
    }

    let baseTable = symbolTable;
    let overlay = null;
    let symbolHtml = "";

    /*
     * APRS:
     *
     * /       = primary table
     * \       = secondary table
     * 0-9     = numeric overlay
     * A-Z     = alphanumeric overlay
     * a-j     = numeric overlay 0-9
     *
     * L_ viene usato dal parser/API per il simbolo
     * meteo con overlay L.
     *
     * La libreria CSS dispone delle sole tabelle:
     * table0 = /
     * table1 = \
     *
     * quindi per L_ dobbiamo usare:
     *
     *     \_
     *
     * e aggiungere la L sopra al simbolo.
     */

    if (symbolTable === "/" || symbolTable === "\\") {

        baseTable = symbolTable;

    } else if (/^[0-9]$/.test(symbolTable)) {

        baseTable = "\\";
        overlay = symbolTable;

    } else if (/^[a-j]$/.test(symbolTable)) {

        baseTable = "\\";
        overlay =
            String(
                symbolTable.charCodeAt(0) -
                "a".charCodeAt(0)
            );

    } else if (/^[A-Z]$/.test(symbolTable)) {

        baseTable = "\\";
        overlay = symbolTable;

    } else {

        baseTable = "/";
    }

    try {

        symbolHtml =
            getAPRSSymbolImageTag(
                baseTable + symbolCode,
                48
            );

    } catch (error) {

        console.error(
            "Errore simbolo APRS:",
            error
        );

        return "";
    }

    if (overlay !== null) {

        let overlayClass =
            "station-overlay";

        if (
            overlay === "L" &&
            symbolCode === "_"
        ) {

            overlayClass += " wx";
        }

        symbolHtml +=
            '<span class="' +
            overlayClass +
            '">' +
            escapeHtml(overlay) +
            '</span>';
    }

    return symbolHtml;
}



/* ============================================================
   COMMENTO / DESCRIZIONE APRS
   ============================================================ */

function extractAprsComment(packet) {

    if (!packet) {
        return null;
    }

    const raw =
        String(
            packet.packet ||
            packet.raw ||
            packet.data ||
            ""
        ).trim();

    if (!raw) {
        return null;
    }

    const colon = raw.indexOf(":");

    if (colon < 0) {
        return null;
    }

    const payload =
        raw.substring(colon + 1);

    /*
     * Non attribuire alla stazione esterna il contenuto
     * di un packet third-party.
     */
    if (payload.startsWith("}")) {
        return null;
    }

    /*
     * Messaggi APRS, telemetria e object/item non sono
     * descrizioni della stazione.
     */
    if (
        payload.startsWith(":") ||
        payload.startsWith("T#") ||
        payload.startsWith(";") ||
        payload.startsWith(")")
    ) {
        return null;
    }

    let comment = null;

    /*
     * Posizione compressa.
     *
     * Dopo ! o =:
     *   1 carattere symbol table
     *   4 latitudine
     *   4 longitudine
     *   1 symbol code
     *
     * Totale 10 caratteri dopo il data type.
     */
    if (
        (payload.startsWith("!") ||
         payload.startsWith("=")) &&
        payload.length >= 11
    ) {

        const body =
            payload.substring(11);

        comment = body;

    } else {

        /*
         * Posizione non compressa.
         * Riconosciamo il blocco DDMM.mmN/DDDMM.mmE?
         * e prendiamo ciò che segue il symbol code.
         */
        const uncompressed =
            payload.match(
                /^[!=@\/]?\d{4}\.\d{2}[NS][\/\\]\d{5}\.\d{2}[EW].(.*)$/
            );

        if (uncompressed) {
            comment = uncompressed[1];
        }
    }

    if (comment === null || comment === undefined) {
        return null;
    }

    comment =
        String(comment)
            .replace(/^[\s!]+/, "")
            .trim();

    if (!comment) {
        return null;
    }

    /*
     * Rimuove il prefisso !G tipico dei beacon LoRa APRS.
     */
    comment =
        comment.replace(/^G/, "");

    /*
     * Rimuove i campi meteo APRS presenti prima del testo libero.
     * Esempio:
     * .../...g...t087h97b10101LoRa APRS iGate
     */
    comment =
        comment
            .replace(/^\.\.\.\/\.\.\.g\.\.\./i, "")
            .replace(/^c\d{3}/i, "")
            .replace(/^s\d{3}/i, "")
            .replace(/^g\d{3}/i, "")
            .replace(/^t-?\d{3}/i, "")
            .replace(/^h\d{2,3}/i, "")
            .replace(/^b\d{5}/i, "")
            .replace(/^r\d{3}/i, "")
            .replace(/^p\d{3}/i, "")
            .replace(/^P\d{3}/, "")
            .trim();

    /*
     * Alcuni beacon LoRa possono avere ancora una "x"
     * o altro carattere di controllo/commento davanti al testo.
     * Lo manteniamo solo se fa realmente parte di una parola.
     */
    if (
        comment.length > 1 &&
        /^[^A-Za-z0-9À-ÿ]/.test(comment)
    ) {
        comment =
            comment.substring(1).trim();
    }

    if (!comment) {
        return null;
    }

    /*
     * Evita di mostrare frammenti evidentemente solo tecnici.
     */
    if (
        /^[-.\/0-9\s]+$/.test(comment)
    ) {
        return null;
    }

    return comment;
}


function renderStationInfo(comment) {

    if (!comment) {
        return "";
    }

    return `
        <div class="station-info-box">

            <div class="station-info-title">
                📝 ${t(
                    "Informazioni stazione",
                    "Station information"
                )}
            </div>

            <div class="station-info-text">
                ${escapeHtml(comment)}
            </div>

        </div>
    `;
}


/* ============================================================
   METEO APRS
   ============================================================ */

/*
 * APRS WEATHER
 *
 * tDDD = temperatura Fahrenheit
 * hDD  = umidità relativa %
 * bDDDDD = pressione in decimi di hPa
 *
 * rDDD = pioggia ultima ora, centesimi di pollice
 * pDDD = pioggia ultime 24 ore
 * PDDD = pioggia da mezzanotte
 *
 * gDDD = raffica vento mph
 * sDDD = velocità vento mph
 * dDDD = direzione vento
 */

function parseWeather(packet) {

    if (!packet) {
        return null;
    }

    const raw =
        String(
            packet.packet ||
            packet.raw ||
            packet.data ||
            ""
        );

    if (!raw) {
        return null;
    }

    const colon = raw.indexOf(":");

    const payload =
        colon >= 0
            ? raw.substring(colon + 1)
            : raw;

    const weather = {};

    /*
     * TEMPERATURA
     */

    const tempMatch =
        payload.match(/t(-?\d{3})/i);

    if (tempMatch) {

        const fahrenheit =
            Number(tempMatch[1]);

        if (
            fahrenheit !== 999 &&
            Number.isFinite(fahrenheit)
        ) {

            weather.temperature =
                (fahrenheit - 32) * 5 / 9;
        }
    }


    /*
     * UMIDITÀ
     *
     * APRS:
     * h01-h99  = valore percentuale
     * h00      = 100%
     * h000     = 100%
     * h999     = dato non disponibile
     */

    const humidityMatch =
        payload.match(/h(\d{2,3})/i);

    if (humidityMatch) {

        const rawHumidity =
            Number(humidityMatch[1]);

        let humidity = null;

        if (
            rawHumidity === 0
        ) {

            // APRS h00 / h000 = 100%
            humidity = 100;

        } else if (
            rawHumidity >= 1 &&
            rawHumidity <= 100
        ) {

            humidity = rawHumidity;
        }

        if (humidity !== null) {

            weather.humidity =
                humidity;
        }
    }


    /*
     * PRESSIONE
     */

    const pressureMatch =
        payload.match(/b(\d{5})/i);

    if (pressureMatch) {

        const pressure =
            Number(pressureMatch[1]) / 10;

        if (
            pressure > 800 &&
            pressure < 1200
        ) {

            weather.pressure =
                pressure;
        }
    }


    /*
     * DIREZIONE VENTO
     */

    const windDirectionMatch =
        payload.match(/d(\d{3})/i);

    if (windDirectionMatch) {

        const direction =
            Number(windDirectionMatch[1]);

        if (
            direction >= 0 &&
            direction <= 360
        ) {

            weather.windDirection =
                direction;
        }
    }


    /*
     * VELOCITÀ VENTO
     *
     * APRS usa mph.
     */

    const windSpeedMatch =
        payload.match(/s(\d{3})/i);

    if (windSpeedMatch) {

        const mph =
            Number(windSpeedMatch[1]);

        if (mph !== 999) {

            weather.windSpeed =
                mph * 1.609344;
        }
    }


    /*
     * RAFFICA VENTO
     */

    const gustMatch =
        payload.match(/g(\d{3})/i);

    if (gustMatch) {

        const mph =
            Number(gustMatch[1]);

        if (mph !== 999) {

            weather.gust =
                mph * 1.609344;
        }
    }


    /*
     * PIOGGIA ULTIMA ORA
     *
     * APRS: centesimi di pollice.
     */

    const rainHourMatch =
        payload.match(/r(\d{3})/i);

    if (rainHourMatch) {

        const hundredths =
            Number(rainHourMatch[1]);

        if (hundredths !== 999) {

            weather.rainHour =
                hundredths * 0.254;
        }
    }


    /*
     * PIOGGIA 24 ORE
     */

    const rain24Match =
        payload.match(/p(\d{3})/i);

    if (rain24Match) {

        const hundredths =
            Number(rain24Match[1]);

        if (hundredths !== 999) {

            weather.rain24 =
                hundredths * 0.254;
        }
    }


    /*
     * PIOGGIA DA MEZZANOTTE
     */

    const rainMidnightMatch =
        payload.match(/P(\d{3})/);

    if (rainMidnightMatch) {

        const hundredths =
            Number(rainMidnightMatch[1]);

        if (hundredths !== 999) {

            weather.rainMidnight =
                hundredths * 0.254;
        }
    }


    /*
     * Se non abbiamo trovato nessun dato
     * meteo non è un packet meteo.
     */

    if (
        Object.keys(weather).length === 0
    ) {

        return null;
    }

    weather.timestamp =
        packet.timestamp ||
        packet.received_at ||
        packet.time ||
        null;

    weather.packet =
        raw;

    return weather;
}


/* ============================================================
   FORMAT METEO
   ============================================================ */

function weatherCard(
    title,
    value,
    unit,
    icon
) {

    if (
        value === null ||
        value === undefined
    ) {

        value = "-";
    }

    return `

        <div class="card weather-card">

            <div class="card-title">

                ${icon} ${title}

            </div>

            <div class="card-value">

                ${escapeHtml(value)}
                ${unit}

            </div>

        </div>

    `;
}


function renderWeather(weather) {

    if (!weather) {
        return "";
    }

    let html = `

        <h2 class="weather-title">

            <span class="weather-title-icon">
                🌤️
            </span>

            ${t("Dati meteo", "Weather data")}

        </h2>

        <div class="grid">

    `;


    if (
        weather.temperature !== undefined
    ) {

        html +=
            weatherCard(
                t("Temperatura", "Temperature"),
                weather.temperature.toFixed(1),
                " °C",
                "🌡️"
            );
    }


    if (
        weather.humidity !== undefined
    ) {

        html +=
            weatherCard(
                t("Umidità", "Humidity"),
                weather.humidity,
                " %",
                "💧"
            );
    }


    if (
        weather.pressure !== undefined
    ) {

        html +=
            weatherCard(
                t("Pressione", "Pressure"),
                weather.pressure.toFixed(1),
                " hPa",
                "🔵"
            );
    }


    if (
        weather.windDirection !== undefined
    ) {

        html +=
            weatherCard(
                t("Direzione vento", "Wind direction"),
                weather.windDirection,
                "°",
                "🧭"
            );
    }


    if (
        weather.windSpeed !== undefined
    ) {

        html +=
            weatherCard(
                t("Vento", "Wind"),
                weather.windSpeed.toFixed(1),
                " km/h",
                "💨"
            );
    }


    if (
        weather.gust !== undefined
    ) {

        html +=
            weatherCard(
                t("Raffica", "Gust"),
                weather.gust.toFixed(1),
                " km/h",
                "🌬️"
            );
    }


    if (
        weather.rainHour !== undefined
    ) {

        html +=
            weatherCard(
                t("Pioggia 1 ora", "Rain 1 hour"),
                weather.rainHour.toFixed(1),
                " mm",
                "🌧️"
            );
    }


    if (
        weather.rain24 !== undefined
    ) {

        html +=
            weatherCard(
                t("Pioggia 24 ore", "Rain 24 hours"),
                weather.rain24.toFixed(1),
                " mm",
                "🌧️"
            );
    }


    if (
        weather.rainMidnight !== undefined
    ) {

        html +=
            weatherCard(
                t("Pioggia oggi", "Rain today"),
                weather.rainMidnight.toFixed(1),
                " mm",
                "🌧️"
            );
    }


    html += `

        </div>

        <div class="weather-updated">

            ${t("Ultimo aggiornamento:", "Last update:")}
            ${formatDate(weather.timestamp)}

        </div>

    `;

    return html;
}


/* ============================================================
   POSIZIONE
   ============================================================ */

function getPacketPosition(packet) {

    if (!packet) {
        return null;
    }

    const latitude =
        Number(
            packet.latitude ??
            packet.lat
        );

    const longitude =
        Number(
            packet.longitude ??
            packet.lon
        );

    if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
    ) {

        return null;
    }

    if (
        latitude < -90 ||
        latitude > 90 ||
        longitude < -180 ||
        longitude > 180
    ) {

        return null;
    }

    return {
        latitude,
        longitude
    };
}


/* ============================================================
   AVVIO
   ============================================================ */

async function loadStation() {

    const content =
        document.getElementById("content");


    if (!callsign) {

        content.className = "error";

        content.innerHTML =
            t(
                "Nessun nominativo specificato.",
                "No callsign specified."
            );

        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/station?callsign=" +
                encodeURIComponent(callsign) +
                "&hours=" +
                encodeURIComponent(stationHours),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " + response.status
            );
        }


        const data =
            await response.json();


        /*
         * =====================================================
         * DATI GIÀ AGGREGATI DAL BACKEND V2
         * =====================================================
         */

        const summary =
            data.summary || {};

        const stationPackets =
            Array.isArray(data.source_packets)
                ? data.source_packets
                : [];


        /*
         * =====================================================
         * POSIZIONE
         * =====================================================
         */

        let stationPosition = null;

        if (
            data.position &&
            Number.isFinite(
                Number(data.position.latitude)
            ) &&
            Number.isFinite(
                Number(data.position.longitude)
            )
        ) {

            stationPosition = {
                latitude:
                    Number(
                        data.position.latitude
                    ),

                longitude:
                    Number(
                        data.position.longitude
                    )
            };
        }


        /*
         * =====================================================
         * METEO
         * =====================================================
         */

        let latestWeather = null;

        for (const packet of stationPackets) {

            const weather =
                parseWeather(packet);

            if (weather) {

                latestWeather =
                    weather;

                break;
            }
        }


        /*
         * =====================================================
         * INFORMAZIONI / COMMENTO APRS
         * =====================================================
         */

        const latestStationComment =
            data.info
                ? String(data.info).trim()
                : null;


        /*
         * =====================================================
         * GRUPPI GIÀ CALCOLATI DAL BACKEND
         * =====================================================
         */

        const transmittedDirect =
            Array.isArray(data.transmitted_direct)
                ? data.transmitted_direct
                : [];

        const transmittedVia =
            Array.isArray(data.transmitted_via)
                ? data.transmitted_via
                : [];

        const receivedDirect =
            Array.isArray(data.received_direct)
                ? data.received_direct
                : [];

        const receivedVia =
            Array.isArray(data.received_via)
                ? data.received_via
                : [];

        const transitGroups =
            Array.isArray(data.transit_groups)
                ? data.transit_groups
                : [];


        /*
         * =====================================================
         * SIMBOLO
         * =====================================================
         */

        let symbolHtml = "";

        if (
            data.symbol &&
            data.symbol.symbol_table &&
            data.symbol.symbol_code
        ) {

            symbolHtml =
                getStationSymbolHtml(
                    data.symbol.symbol_table,
                    data.symbol.symbol_code
                );
        }


        /*
         * =====================================================
         * DATE ATTIVITÀ
         * =====================================================
         */

        const firstDate =
            data.activity &&
            data.activity.first
                ? new Date(
                    data.activity.first
                )
                : null;

        const lastDate =
            data.activity &&
            data.activity.last
                ? new Date(
                    data.activity.last
                )
                : null;


        /*
         * =====================================================
         * RENDER GROUP
         * =====================================================
         */

        function renderGroup(group) {

            const route =
                group.category === "via"

                    ?

                    `
                        <span class="via">
                            ${t("VIA", "VIA")} ${escapeHtml(
                                group.via || "-"
                            )}
                        </span>
                    `

                    :

                    `
                        <span class="direct">
                            ${t("DIRETTA", "DIRECT")}
                        </span>
                    `;


            return `

                <div class="reception">

                    <div class="reception-head">

                        <span class="receiver">

                            ${escapeHtml(
                                group.name
                            )}

                        </span>

                        ${route}

                    </div>

                    <div class="route">

                        <strong>
                            ${group.count}
                        </strong>

                        ${
                            group.count === 1
                                ? "volta"
                                : "volte"
                        }

                        &nbsp;·&nbsp;

                        ${t("ultima:", "last:")}

                        <strong>
                            ${formatDate(
                                group.last
                            )}
                        </strong>

                    </div>

                </div>

            `;
        }


        function renderSection(
            groups,
            emptyText
        ) {

            if (!groups.length) {

                return `

                    <div class="empty">

                        ${emptyText}

                    </div>

                `;
            }


            return groups
                .map(renderGroup)
                .join("");
        }


        function summaryCard(title, value, className = "") {

            if (value === null ||
                value === undefined ||
                value === 0 ||
                value === "") {
                return "";
            }

            return `
                <div class="card card-accent">
                    <div class="card-title">
                        ${escapeHtml(title)}
                    </div>
                    <div class="card-value ${className}">
                        ${escapeHtml(value)}
                    </div>
                </div>
            `;
        }


        function renderTransitGroup(group) {

            return `
                <div class="reception">
                    <div class="reception-head">
                        <span class="transit-source">
                            ${escapeHtml(group.source)}
                        </span>
                        <span class="transit-arrow">→</span>
                        <span class="via">
                            ${t("VIA", "VIA")} ${escapeHtml(callsign)}
                        </span>
                        <span class="transit-arrow">→</span>
                        <span class="receiver">
                            ${escapeHtml(group.receiver)}
                        </span>
                    </div>
                    <div class="route">
                        <strong>${group.count}</strong>
                        ${group.count === 1
                            ? t("volta", "time")
                            : t("volte", "times")}
                        &nbsp;·&nbsp;
                        ${t("ultima:", "last:")}
                        <strong>${formatDate(group.last)}</strong>
                    </div>
                </div>
            `;
        }


        /*
         * =====================================================
         * RENDER PAGINA
         * =====================================================
         */

        content.className = "";


        content.innerHTML = `

            <div class="station-header">

                <div class="station-symbol">

                    ${symbolHtml}

                </div>

                <div>

                    <div class="station-name">

                        ${escapeHtml(
                            callsign
                        )}

                    </div>

                    <div class="station-subtitle">

                        ${t("Attività APRS", "APRS activity")}

                    </div>

                </div>

            </div>


            <!-- =============================================
                 INFORMAZIONI STAZIONE
                 ============================================= -->

            ${renderStationInfo(
                latestStationComment
            )}


            <!-- =============================================
                 METEO
                 ============================================= -->

            ${renderWeather(
                latestWeather
            )}


            <!-- =============================================
                 RIEPILOGO
                 ============================================= -->

            <div class="grid">

                ${summaryCard(
                    t("Pacchetti trasmessi", "Transmitted packets"),
                    summary.transmitted_packets || 0
                )}

                ${summaryCard(
                    t("Pacchetti ricevuti", "Received packets"),
                    summary.received_packets || 0
                )}

                ${summaryCard(
                    t("Stazioni ricevute direttamente", "Stations received directly"),
                    receivedDirect.length,
                    "direct"
                )}

                ${summaryCard(
                    t("Stazioni ricevute via", "Stations received via"),
                    receivedVia.length,
                    "via"
                )}

                ${summaryCard(
                    t("Pacchetti transitati via ", "Packets relayed via ") + callsign,
                    summary.transit_packets || 0,
                    "transit"
                )}

                ${summaryCard(
                    t("Stazioni transitate via ", "Stations relayed via ") + callsign,
                    summary.transit_stations || 0,
                    "transit"
                )}

            </div>


            <div class="grid">

                ${firstDate ? `
                    <div class="card">
                        <div class="card-title">${t("Prima attività", "First activity")}</div>
                        <div class="card-value">${formatDate(firstDate)}</div>
                    </div>
                ` : ""}

                ${lastDate ? `
                    <div class="card">
                        <div class="card-title">${t("Ultima attività", "Last activity")}</div>
                        <div class="card-value">${formatDate(lastDate)}</div>
                    </div>
                ` : ""}

                ${stationPosition ? `
                    <div class="card">
                        <div class="card-title">${t("Posizione", "Position")}</div>
                        <div class="card-value">
                            ${stationPosition.latitude.toFixed(5)}, ${stationPosition.longitude.toFixed(5)}
                        </div>
                    </div>
                ` : ""}

            </div>


            <!-- =============================================
                 TRASMISSIONI DELLA STAZIONE
                 ============================================= -->

            ${transmittedDirect.length ? `
                <h2>
                    📡 ${t("Pacchetti di", "Packets from")} ${escapeHtml(callsign)}
                    ${t("ricevuti direttamente", "received directly")}
                </h2>
                <div class="section">
                    ${renderSection(
                        transmittedDirect,
                        ""
                    )}
                </div>
            ` : ""}

            ${transmittedVia.length ? `
                <h2>
                    🔁 ${t("Pacchetti di", "Packets from")} ${escapeHtml(callsign)}
                    ${t("ricevuti via altra stazione", "received via another station")}
                </h2>
                <div class="section">
                    ${renderSection(
                        transmittedVia,
                        ""
                    )}
                </div>
            ` : ""}


            <!-- =============================================
                 DATI DI RICEZIONE (solo se esistono)
                 ============================================= -->

            ${receivedDirect.length ? `
                <h2>
                    📶 ${t("Stazioni ricevute direttamente", "Stations received directly")}
                </h2>
                <div class="section">
                    ${renderSection(
                        receivedDirect,
                        ""
                    )}
                </div>
            ` : ""}

            ${receivedVia.length ? `
                <h2>
                    🔁 ${t("Stazioni ricevute via altra stazione", "Stations received via another station")}
                </h2>
                <div class="section">
                    ${renderSection(
                        receivedVia,
                        ""
                    )}
                </div>
            ` : ""}


            <!-- =============================================
                 TRANSITI VIA STAZIONE
                 ============================================= -->

            ${transitGroups.length ? `
                <h2>
                    🔀 ${t("Pacchetti transitati via", "Packets relayed via")} ${escapeHtml(callsign)}
                    <span class="section-title-note">
                        ${t("visti dai nostri ricevitori", "seen by our receivers")}
                    </span>
                </h2>
                <div class="section">
                    ${transitGroups
                        .map(renderTransitGroup)
                        .join("")}
                </div>
            ` : ""}

        `;

    }

    catch (error) {

        console.error(error);

        content.className = "error";

        content.innerHTML = `

            ${t(
                "Errore nel caricamento della stazione:",
                "Error loading station:"
            )}

            ${escapeHtml(
                error.message
            )}

        `;
    }
}


const languageSelect =
    document.getElementById("languageSelect");

if (languageSelect) {
    languageSelect.addEventListener(
        "change",
        () => {
            applyLanguage(languageSelect.value);
            loadStation();
        }
    );
}


loadStation();

</script>
